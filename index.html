<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تست ارسال پیامک</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
            margin: 0;
            direction: rtl;
        }
        .container {
            background: white;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            width: 360px;
            max-width: 90%;
        }
        h2 {
            text-align: center;
            color: #16a34a;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.2s;
        }
        input:focus {
            border-color: #16a34a;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #15803d;
            transform: scale(1.01);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #result {
            margin-top: 16px;
            padding: 10px;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow: auto;
        }
        .success {
            color: #16a34a;
        }
        .error {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📱 تست ارسال پیامک</h2>
        <div class="form-group">
            <label>شماره تلفن (مثلاً 09123456789)</label>
            <input type="tel" id="phone" placeholder="09123456789" value="09123456789" />
        </div>
        <div class="form-group">
            <label>کد ۶ رقمی (اختیاری، خودکار تولید می‌شود)</label>
            <input type="text" id="code" placeholder="123456" value="" />
        </div>
        <button id="sendBtn">📤 ارسال پیامک</button>
        <div id="result">منتظر ارسال...</div>
    </div>

    <script>
        // ===== آدرس Worker تست =====
        // این آدرس را به آدرس واقعی Worker خود تغییر دهید
        const WORKER_URL = 'https://souq-bot.mehdi11eidani.workers.dev/api/send-test';

        document.getElementById('sendBtn').addEventListener('click', async function() {
            const phone = document.getElementById('phone').value.trim();
            let code = document.getElementById('code').value.trim();

            // اگر کد وارد نشده، یک کد تصادفی بساز
            if (!code) {
                code = Math.floor(100000 + Math.random() * 900000).toString();
                document.getElementById('code').value = code;
            }

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '⏳ در حال ارسال درخواست...';
            resultDiv.className = '';

            const btn = this;
            btn.disabled = true;

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, code })
                });

                const data = await response.json();
                console.log('پاسخ سرور:', data);

                if (data.success) {
                    resultDiv.innerHTML = `✅ ${data.message || 'پیامک ارسال شد!'}\n` +
                        `📋 روش: ${data.method || 'نامشخص'}\n` +
                        `📦 پاسخ دقیق: ${JSON.stringify(data.data || {}, null, 2)}`;
                    resultDiv.className = 'success';
                } else {
                    resultDiv.innerHTML = `❌ خطا: ${data.error || 'خطای ناشناخته'}\n` +
                        `📋 جزئیات: ${JSON.stringify(data.details || data, null, 2)}\n\n` +
                        `💡 نکات:\n` +
                        `- کلید API و تنظیمات SMS.ir را بررسی کنید.\n` +
                        `- مطمئن شوید Worker به درستی Deploy شده است.\n` +
                        `- آدرس Worker را در کد HTML بررسی کنید.`;
                    resultDiv.className = 'error';
                }
            } catch (err) {
                console.error('خطا در ارتباط با Worker:', err);
                resultDiv.innerHTML = `❌ خطا در ارتباط با سرور:\n${err.message}\n\n` +
                    `🔍 راه‌حل‌ها:\n` +
                    `1. آدرس Worker را بررسی کنید (${WORKER_URL})\n` +
                    `2. مطمئن شوید Worker فعال است.\n` +
                    `3. در Console مرورگر خطاهای CORS را بررسی کنید.`;
                resultDiv.className = 'error';
            }

            btn.disabled = false;
        });
    </script>
</body>
    </html>
