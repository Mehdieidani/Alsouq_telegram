<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدار | J-DAR</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0c">
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJub21lIjogIkptZGFyIiwKICAic2hvcnRfbmFtZSI6ICJKLUStandardIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGEwYTBjIiwKICAidGhlbWVfY29sb3IiOiAiIzBhMGEwYyIKfQ==">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Vazir';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir.woff2') format('woff2');
            font-weight: normal;
        }
        @font-face {
            font-family: 'Vazir';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir-Bold.woff2') format('woff2');
            font-weight: bold;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', 'Inter', sans-serif;
            background: #0a0a0c; color: #fff; min-height: 100vh; direction: rtl; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(123, 90, 255, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(255, 100, 150, 0.05) 0%, transparent 60%), #0a0a0c;
            z-index: -1;
        }
        .container { max-width: 500px; margin: 0 auto; padding: 20px 16px 90px 16px; position: relative; z-index: 10; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { display: flex; align-items: center; gap: 8px; }
        .logo-icon {
            width: 44px; height: 44px; background: linear-gradient(145deg, #7b5aff, #a58aff);
            border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white;
            box-shadow: 0 10px 20px -5px rgba(123, 90, 255, 0.4);
        }
        .logo-text {
            font-weight: 800; font-size: 24px; background: linear-gradient(135deg, #fff, #e0d0ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;
        }
        .header-left { display: flex; gap: 8px; }
        .icon-btn {
            width: 44px; height: 44px; border-radius: 16px; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 20px; cursor: pointer; transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: rgba(255, 255, 255, 0.2); }
        
        /* Layouts & Cards */
        .wallet-card {
            background: rgba(20, 20, 30, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px; padding: 20px; margin-bottom: 25px; box-shadow: 0 20px 35px -20px rgba(0, 0, 0, 0.8);
        }
        .wallet-row { display: flex; justify-content: space-between; align-items: center; }
        .wallet-info h4 { font-size: 14px; color: #aaa; font-weight: 500; }
        .wallet-info .amount { font-size: 32px; font-weight: 700; color: #fff; }
        .wallet-info small { font-size: 14px; color: #7b5aff; }
        .wallet-points {
            background: rgba(123, 90, 255, 0.15); border: 1px solid rgba(123, 90, 255, 0.3);
            border-radius: 30px; padding: 10px 18px; display: flex; align-items: center; gap: 8px; color: #a58aff;
        }
        .wallet-points i { color: #ffd966; font-size: 20px; }
        .wallet-points .points-num { font-weight: 700; font-size: 18px; color: #fff; }

        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 30px; }
        .action-item {
            background: rgba(20, 20, 30, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px; padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s; color: #fff;
        }
        .action-item:hover { background: rgba(123, 90, 255, 0.2); border-color: rgba(123, 90, 255, 0.3); transform: translateY(-4px); }
        .action-item i { font-size: 26px; color: #a58aff; }
        .action-item span { font-size: 11px; font-weight: 500; opacity: 0.8; }

        /* Forms & Inputs inside Modals */
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(20px); z-index: 1000; overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-content {
            max-width: 500px; margin: 0 auto; background: #0f0f14; min-height: 100vh; padding: 24px; padding-bottom: 100px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .modal-header h3 { font-size: 20px; color: #a58aff; font-weight: bold; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #ccc; margin-bottom: 8px; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 14px 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; color: white; outline: none; font-family: 'Vazir', sans-serif; transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #7b5aff; background: rgba(123, 90, 255, 0.05); }
        
        .image-uploader {
            border: 2px dashed rgba(123, 90, 255, 0.4); border-radius: 24px; padding: 30px 20px;
            text-align: center; cursor: pointer; transition: 0.2s; background: rgba(123, 90, 255, 0.02);
        }
        .image-uploader:hover { border-color: #7b5aff; background: rgba(123, 90, 255, 0.05); }
        .image-uploader i { font-size: 32px; color: #a58aff; margin-bottom: 10px; }
        .preview-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .preview-box { width: 70px; height: 70px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }

        .submit-btn {
            background: linear-gradient(135deg, #7b5aff, #5a3bcf); color: white; border: none;
            border-radius: 24px; padding: 16px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 10px 20px rgba(123, 90, 255, 0.2);
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(123, 90, 255, 0.3); }

        /* General Navigation styling */
        .page { display: none; }
        .page.active { display: block; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto;
            background: rgba(15, 15, 20, 0.95); backdrop-filter: blur(30px); border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-around; padding: 12px 0; border-top-left-radius: 30px; border-top-right-radius: 30px; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #aaa; cursor: pointer; transition: 0.2s; font-size: 12px; }
        .nav-item.active { color: #a58aff; }
        .nav-item i { font-size: 24px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-bolt"></i></div>
                <span class="logo-text">J-DAR</span>
            </div>
            <div class="header-left">
                <button class="icon-btn" id="langMainBtn"><i class="fas fa-globe"></i></button>
            </div>
        </div>

        <div id="homePage" class="page active">
            <div class="wallet-card">
                <div class="wallet-row">
                    <div class="wallet-info">
                        <h4>💰 موجودی کیف پول</h4>
                        <div class="amount"><span id="walletBalance">۰</span> <small>تومان</small></div>
                    </div>
                    <div class="wallet-points">
                        <i class="fas fa-star"></i>
                        <span class="points-num" id="userPoints">۰</span>
                    </div>
                </div>
            </div>

            <div class="action-grid">
                <div class="action-item" onclick="openModal('postAdModal')">
                    <i class="fas fa-plus-circle"></i>
                    <span>ثبت آگهی</span>
                </div>
                <div class="action-item" onclick="openModal('chargeWalletModal')">
                    <i class="fas fa-wallet"></i>
                    <span>شارژ حساب</span>
                </div>
                <div class="action-item" id="vipBtn">
                    <i class="fas fa-crown"></i>
                    <span>ویژه</span>
                </div>
                <div class="action-item" id="convertPointsBtn">
                    <i class="fas fa-gift"></i>
                    <span>تبدیل</span>
                </div>
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="جستجو در آگهی‌ها...">
            </div>
            <div id="adsGrid" class="ads-grid"></div>
        </div>

        <div id="favoritesPage" class="page">
            <h3 style="margin-bottom:20px; color:#a58aff;"><i class="fas fa-heart"></i> علاقه‌مندی‌ها</h3>
            <div class="ads-grid" id="favoritesGrid"></div>
        </div>

        <div id="profilePage" class="page">
            <div class="wallet-card">
                <h3>تنظیمات حساب کاربری</h3>
                <br>
                <div class="form-group">
                    <label>نام نمایشی</label>
                    <input type="text" id="displayName" placeholder="نام شما">
                </div>
                <div class="form-group">
                    <label>کشور</label>
                    <select id="country">
                        <option value="IR">🇮🇷 ایران</option>
                        <option value="IQ">🇮🇶 عراق</option>
                    </select>
                </div>
                <button class="submit-btn" id="saveProfile">ذخیره تغییرات</button>
            </div>
        </div>
    </div>

    <div class="modal" id="postAdModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle"></i> ثبت آگهی جدید</h3>
                <button class="icon-btn" onclick="closeModal('postAdModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="adForm" onsubmit="handlePostAd(event)">
                <div class="form-group">
                    <label>عنوان آگهی</label>
                    <input type="text" id="adTitle" required placeholder="مثال: تور زیارتی کربلا ۳ روزه">
                </div>
                <div class="form-group">
                    <label>دسته‌بندی</label>
                    <select id="adCategory" required>
                        <option value="گردشگری">گردشگری</option>
                        <option value="زیارت">زیارت</option>
                        <option value="پزشکی">پزشکی</option>
                        <option value="زیبایی">زیبایی</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>قیمت (تومان / دینار - یا عدد یا عبارت توافقی)</label>
                    <input type="text" id="adPrice" required placeholder="مثال: ۵,۰۰۰,۰۰۰ یا توافقی">
                </div>
                <div class="form-group">
                    <label>توضیحات کامل آگهی</label>
                    <textarea id="adDesc" rows="5" required placeholder="جزئیات و ویژگی‌های خدمات خود را بنویسید..."></textarea>
                </div>
                <div class="form-group">
                    <label>شماره تماس</label>
                    <input type="tel" id="adPhone" required placeholder="مثال: 09123456789">
                </div>
                <div class="form-group">
                    <label>تصاویر آگهی</label>
                    <div class="image-uploader" onclick="document.getElementById('adImagesInput').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>برای انتخاب عکس کلیک کنید</p>
                        <input type="file" id="adImagesInput" multiple accept="image/*" style="display:none" onchange="previewImages(event)">
                    </div>
                    <div class="preview-container" id="imagesPreview"></div>
                </div>
                <button type="submit" class="submit-btn">ارسال جهت بررسی و تایید</button>
            </form>
        </div>
    </div>

    <div class="modal" id="chargeWalletModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-wallet"></i> افزایش موجودی کیف پول</h3>
                <button class="icon-btn" onclick="closeModal('chargeWalletModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="chargeForm" onsubmit="handleChargeRequest(event)">
                <div class="form-group">
                    <label>مبلغ مورد نظر برای شارژ (تومان)</label>
                    <input type="number" id="chargeAmount" required placeholder="مثال: 100000">
                </div>
                <div class="form-group">
                    <label>بارگذاری فیش واریزی / عکس رسید پرداخت</label>
                    <div class="image-uploader" onclick="document.getElementById('receiptInput').click()">
                        <i class="fas fa-receipt"></i>
                        <p>انتخاب تصویر فیش واریزی</p>
                        <input type="file" id="receiptInput" accept="image/*" style="display:none" required onchange="previewReceipt(event)">
                    </div>
                    <div class="preview-container" id="receiptPreview"></div>
                </div>
                <button type="submit" class="submit-btn">ارسال درخواست شارژ</button>
            </form>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('home')"><i class="fas fa-home"></i><span>خانه</span></div>
        <div class="nav-item" onclick="switchPage('favorites')"><i class="fas fa-heart"></i><span>علاقه‌مندی</span></div>
        <div class="nav-item" onclick="switchPage('profile')"><i class="fas fa-user"></i><span>پروفایل</span></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.enableClosingConfirmation(); }
        
        const API_BASE = 'https://souq-bot.mehdi11eidani.workers.dev';
        const tgUser = tg?.initDataUnsafe?.user || { id: "123456", username: "GuestUser" };

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId + 'Page').classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // پیش‌نمایش عکس‌های آگهی
        let selectedAdFiles = [];
        function previewImages(event) {
            const container = document.getElementById('imagesPreview');
            container.innerHTML = '';
            selectedAdFiles = Array.from(event.target.files);
            selectedAdFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const box = document.createElement('div');
                    box.className = 'preview-box';
                    box.innerHTML = `<img src="${e.target.result}">`;
                    container.appendChild(box);
                }
                reader.readAsDataURL(file);
            });
        }

        // پیش‌نمایش فیش واریزی
        function previewReceipt(event) {
            const container = document.getElementById('receiptPreview');
            container.innerHTML = '';
            if(event.target.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    container.innerHTML = `<div class="preview-box"><img src="${e.target.result}"></div>`;
                }
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        // ۱. پردازش ثبت آگهی و ارسال داده به ادمین در تلگرام
        async function handlePostAd(e) {
            e.preventDefault();
            const title = document.getElementById('adTitle').value;
            const category = document.getElementById('adCategory').value;
            const price = document.getElementById('adPrice').value;
            const desc = document.getElementById('adDesc').value;
            const phone = document.getElementById('adPhone').value;

            // تبدیل عکس‌ها به base64 جهت ارسال امن به وب‌هویک/ورکر
            const base64Images = [];
            for(let file of selectedAdFiles) {
                const base64 = await toBase64(file);
                base64Images.push(base64);
            }

            const adData = {
                action: 'new_ad',
                userId: tgUser.id,
                username: tgUser.username,
                title, category, price, desc, phone,
                images: base64Images
            };

            tg.showProgress();
            try {
                const response = await fetch(`${API_BASE}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(adData)
                });
                if(response.ok) {
                    tg.showAlert('آگهی شما با موفقیت ثبت شد و پس از تایید مدیریت فعال خواهد شد.');
                    closeModal('postAdModal');
                    document.getElementById('adForm').reset();
                    document.getElementById('imagesPreview').innerHTML = '';
                } else { throw new Error(); }
            } catch {
                tg.showAlert('خطا در ارسال اطلاعات به سرور. لطفا دوباره تلاش کنید.');
            } finally { tg.hideProgress(); }
        }

        // ۲. پردازش درخواست شارژ حساب و ارسال فیش برای تایید ادمین
        async function handleChargeRequest(e) {
            e.preventDefault();
            const amount = document.getElementById('chargeAmount').value;
            const receiptFile = document.getElementById('receiptInput').files[0];

            if(!receiptFile) return;
            const receiptBase64 = await toBase64(receiptFile);

            const chargeData = {
                action: 'charge_request',
                userId: tgUser.id,
                username: tgUser.username,
                amount,
                receipt: receiptBase64
            };

            tg.showProgress();
            try {
                const response = await fetch(`${API_BASE}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(chargeData)
                });
                if(response.ok) {
                    tg.showAlert('درخواست شارژ و فیش شما ارسال شد. پس از بررسی حساب شما شارژ می‌شود.');
                    closeModal('chargeWalletModal');
                    document.getElementById('chargeForm').reset();
                    document.getElementById('receiptPreview').innerHTML = '';
                } else { throw new Error(); }
            } catch {
                tg.showAlert('خطا در ثبت درخواست شارژ.');
            } finally { tg.hideProgress(); }
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // ثبت سرویس ورکر برای پشتیبانی کامل از حالت PWA آفلاین
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGV2ZW50ID0+IHsgfSk7');
        }
    </script>
</body>
</html>
