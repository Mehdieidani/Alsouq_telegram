<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جـدار | پلتفرم آگهی‌ها</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --primary-dark: #4a3db8;
            --bg: #f0f2f8;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #555;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 12px 100px 12px;
            font-family: var(--font);
        }
        body.dark {
            --bg: #12121a;
            --card-bg: #1e1e2e;
            --text: #e4e4f0;
            --text-secondary: #aaa;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(30, 30, 46, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        a {
            text-decoration: none;
            color: var(--primary);
        }
        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-family: inherit;
            transition: var(--transition);
        }
        input,
        textarea,
        select {
            font-family: inherit;
            outline: none;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            width: 100%;
            background: #fff;
            transition: var(--transition);
        }
        body.dark input,
        body.dark textarea,
        body.dark select {
            background: #2a2a3a;
            border-color: #3a3a4a;
            color: #eee;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 12px;
        }

        /* ============================================================
                   APP CONTAINER
                   ============================================================ */
        .app {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            min-height: 90vh;
            padding-bottom: 20px;
            transition: var(--transition);
        }
        body.dark .app {
            background: #1a1a28;
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.85);
        }
        body.dark .app-header {
            background: rgba(26, 26, 40, 0.85);
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }
        .app-header .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .app-header .logo span {
            color: #fd79a8;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .header-actions button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f0f0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text);
            transition: var(--transition);
        }
        body.dark .header-actions button {
            background: #2a2a3a;
            color: #ddd;
        }
        .header-actions button:hover {
            background: #e0e0ea;
            transform: scale(0.95);
        }
        .header-actions .user-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: #fff;
            padding: 4px 14px 4px 10px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .header-actions .user-badge:hover {
            opacity: 0.85;
        }

        /* ============================================================
                   PAGES
                   ============================================================ */
        .page {
            display: none;
            padding: 16px 20px;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
                   AUTH PAGE
                   ============================================================ */
        #authPage {
            padding-top: 40px;
            text-align: center;
        }
        #authPage .auth-logo {
            font-size: 48px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 6px;
        }
        #authPage .auth-sub {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
        .auth-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            text-align: right;
            max-width: 400px;
            margin: 0 auto;
        }
        .auth-box .form-group {
            margin-bottom: 16px;
        }
        .auth-box label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .auth-box .code-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .auth-box .code-row input {
            flex: 1;
        }
        .auth-box .code-row button {
            padding: 12px 16px;
            background: var(--primary);
            color: #fff;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .auth-box .code-row button:hover {
            background: var(--primary-dark);
        }
        .auth-box .captcha-box {
            background: #f0f0f5;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--primary-dark);
            direction: ltr;
            margin: 10px 0;
        }
        body.dark .auth-box .captcha-box {
            background: #2a2a3a;
        }
        .auth-box .captcha-box .captcha-code {
            user-select: none;
        }
        .auth-box .captcha-box button {
            background: none;
            color: var(--primary);
            font-size: 20px;
            padding: 0 8px;
        }
        .auth-toggle {
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .auth-toggle a {
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            transition: var(--transition);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
        }
        .btn-secondary {
            background: #f0f0f5;
            color: var(--text);
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 600;
        }
        body.dark .btn-secondary {
            background: #2a2a3a;
            color: #ddd;
        }

        /* ============================================================
                   ADS LIST
                   ============================================================ */
        .ads-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .ads-header h2 {
            font-size: 20px;
            font-weight: 700;
        }
        .ads-header .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .ads-header .filter-group select,
        .ads-header .filter-group input {
            width: auto;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            background: var(--card-bg);
            border: 1px solid #ddd;
        }
        body.dark .ads-header .filter-group select,
        body.dark .ads-header .filter-group input {
            background: #2a2a3a;
            border-color: #3a3a4a;
            color: #eee;
        }

        .ad-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        body.dark .ad-card {
            border-color: rgba(255, 255, 255, 0.05);
        }
        .ad-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .ad-card .ad-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }
        .ad-card .ad-badge.special {
            background: #fd79a8;
        }
        .ad-card .ad-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
            padding-left: 60px;
        }
        .ad-card .ad-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            margin: 6px 0 10px 0;
        }
        .ad-card .ad-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .ad-card .ad-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 10px;
            margin-top: 6px;
        }
        body.dark .ad-card .ad-footer {
            border-top-color: rgba(255, 255, 255, 0.05);
        }
        .ad-card .ad-footer .likes-comments {
            display: flex;
            gap: 14px;
        }
        .ad-card .ad-footer .likes-comments i {
            margin-left: 4px;
        }
        .ad-card .ad-price {
            font-weight: 700;
            color: var(--primary);
            font-size: 16px;
        }

        /* ============================================================
                   AD DETAIL MODAL (Glassmorphism)
                   ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--glass-shadow);
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 24px;
            position: relative;
            animation: slideUp 0.3s ease;
        }
        body.dark .modal-content {
            background: rgba(26, 26, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.08);
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-close {
            position: absolute;
            top: 12px;
            left: 16px;
            font-size: 24px;
            background: none;
            color: var(--text);
            opacity: 0.7;
            transition: var(--transition);
        }
        .modal-close:hover {
            opacity: 1;
            transform: rotate(90deg);
        }
        .modal-content .ad-title-lg {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .modal-content .ad-meta-lg {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }
        .modal-content .ad-desc {
            font-size: 15px;
            line-height: 1.7;
            margin: 12px 0;
            color: var(--text);
        }
        .modal-content .ad-price-lg {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin: 10px 0;
        }
        .modal-content .ad-interact {
            display: flex;
            gap: 18px;
            align-items: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .modal-content .ad-interact button {
            background: none;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            transition: var(--transition);
            padding: 6px 12px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.04);
        }
        body.dark .modal-content .ad-interact button {
            background: rgba(255, 255, 255, 0.06);
        }
        .modal-content .ad-interact button.liked {
            color: #e74c3c;
        }
        .modal-content .ad-interact button:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        .modal-content .comment-section {
            margin-top: 18px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 14px;
        }
        body.dark .modal-content .comment-section {
            border-top-color: rgba(255, 255, 255, 0.06);
        }
        .modal-content .comment-item {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        body.dark .modal-content .comment-item {
            border-bottom-color: rgba(255, 255, 255, 0.04);
        }
        .modal-content .comment-item .comment-user {
            font-weight: 700;
            color: var(--primary);
            min-width: 70px;
        }
        .modal-content .comment-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .modal-content .comment-input-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 30px;
            font-size: 14px;
        }
        .modal-content .comment-input-row button {
            padding: 10px 18px;
            background: var(--primary);
            color: #fff;
            border-radius: 30px;
            font-weight: 600;
        }
        .modal-content .comment-input-row button:hover {
            background: var(--primary-dark);
        }

        /* ============================================================
                   PROFILE PAGE
                   ============================================================ */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            font-weight: 700;
        }
        .profile-info h2 {
            font-size: 20px;
            font-weight: 700;
        }
        .profile-info .username-hidden {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-info .username-hidden button {
            background: none;
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
        }
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 16px 0;
        }
        .profile-stats .stat-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        body.dark .profile-stats .stat-item {
            border-color: rgba(255, 255, 255, 0.05);
        }
        .profile-stats .stat-item .num {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }
        .profile-stats .stat-item .label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .profile-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }
        .profile-actions button {
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            background: #f0f0f5;
            color: var(--text);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        body.dark .profile-actions button {
            background: #2a2a3a;
            color: #ddd;
        }
        .profile-actions button:hover {
            background: var(--primary);
            color: #fff;
        }
        .profile-actions button.danger:hover {
            background: #e74c3c;
        }

        /* ============================================================
                   ADMIN PANEL
                   ============================================================ */
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0;
        }
        .admin-grid button {
            padding: 14px 8px;
            border-radius: 14px;
            font-weight: 600;
            background: #f0f0f5;
            color: var(--text);
            transition: var(--transition);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        body.dark .admin-grid button {
            background: #2a2a3a;
            color: #ddd;
        }
        .admin-grid button:hover {
            background: var(--primary);
            color: #fff;
        }
        .admin-section {
            margin: 16px 0;
            padding: 16px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        body.dark .admin-section {
            border-color: rgba(255, 255, 255, 0.05);
        }
        .admin-section h4 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .admin-section .admin-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .admin-section .admin-row input,
        .admin-section .admin-row select {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
        }
        .admin-section .admin-row button {
            padding: 8px 16px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }
        .admin-section .admin-row button:hover {
            background: var(--primary-dark);
        }

        /* ============================================================
                   WALLET / TRANSACTIONS
                   ============================================================ */
        .wallet-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
        }
        .wallet-card .balance {
            font-size: 32px;
            font-weight: 800;
        }
        .wallet-card .label {
            opacity: 0.8;
            font-size: 14px;
        }
        .wallet-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .wallet-actions button {
            padding: 10px 20px;
            border-radius: 14px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            backdrop-filter: blur(4px);
        }
        .wallet-actions button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ============================================================
                   TOAST
                   ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            color: var(--text);
            padding: 14px 24px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            font-weight: 600;
            z-index: 9999;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: var(--transition);
            opacity: 0;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
        .toast.success {
            border-right: 4px solid #2ecc71;
        }
        .toast.error {
            border-right: 4px solid #e74c3c;
        }

        /* ============================================================
                   UTILITIES
                   ============================================================ */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .gap-2 {
            gap: 8px;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .mb-2 {
            margin-bottom: 12px;
        }
        .text-center {
            text-align: center;
        }
        .text-secondary {
            color: var(--text-secondary);
        }
        .w-full {
            width: 100%;
        }
        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            .app {
                border-radius: 0;
                min-height: 100vh;
            }
            .modal-content {
                border-radius: 20px;
                margin: 10px;
                padding: 20px 16px;
            }
            .admin-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ============================================================
                   TAB BAR (mobile bottom)
                   ============================================================ */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.9);
        }
        body.dark .tab-bar {
            background: rgba(26, 26, 40, 0.9);
            border-top-color: rgba(255, 255, 255, 0.05);
        }
        .tab-bar button {
            background: none;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-weight: 500;
            transition: var(--transition);
            padding: 4px 12px;
        }
        .tab-bar button i {
            font-size: 22px;
        }
        .tab-bar button.active {
            color: var(--primary);
        }
        .tab-bar button:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div id="toast" class="toast"></div>

    <!-- ============================================================
    APP
    ============================================================ -->
    <div class="app" id="app">

        <!-- ===== HEADER ===== -->
        <header class="app-header">
            <div class="logo">جـ<span>دار</span></div>
            <div class="header-actions">
                <button id="themeToggle" title="تغییر تم"><i class="fas fa-moon"></i></button>
                <button id="langToggle" title="تغییر زبان"><i class="fas fa-globe"></i></button>
                <div class="user-badge" id="userBadge" style="display:none;">
                    <i class="fas fa-user"></i>
                    <span id="userBadgeName">کاربر</span>
                </div>
            </div>
        </header>

        <!-- ===== PAGES ===== -->

        <!-- AUTH PAGE -->
        <div id="authPage" class="page active">
            <div class="auth-logo">جـدار</div>
            <div class="auth-sub">پلتفرم هوشمند آگهی‌ها</div>
            <div class="auth-box" id="authBox">
                <div id="authForm">
                    <div class="form-group">
                        <label id="authLabelUser">👤 نام کاربری</label>
                        <input type="text" id="authUsername" placeholder="نام کاربری خود را وارد کنید" dir="ltr">
                    </div>
                    <div class="form-group">
                        <label id="authLabelPhone">📱 شماره تلفن</label>
                        <input type="tel" id="authPhone" placeholder="مثلاً 09123456789" dir="ltr">
                    </div>
                    <div class="form-group" id="codeGroup" style="display:none;">
                        <label>🔑 کد تایید</label>
                        <div class="code-row">
                            <input type="text" id="authCode" placeholder="کد ۶ رقمی" maxlength="6" dir="ltr">
                            <button id="sendCodeBtn">ارسال کد</button>
                        </div>
                        <div class="captcha-box" id="captchaBox">
                            <span class="captcha-code" id="captchaCode">ABCD12</span>
                            <button id="refreshCaptcha"><i class="fas fa-sync-alt"></i></button>
                        </div>
                    </div>
                    <button class="btn-primary" id="authSubmitBtn">ثبت‌نام / ورود</button>
                    <div class="auth-toggle" id="authToggle">
                        <span id="authToggleText">قبلاً ثبت‌نام کرده‌اید؟</span>
                        <a id="authToggleLink">ورود</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- HOME PAGE (Ads) -->
        <div id="homePage" class="page">
            <div class="ads-header">
                <h2>📌 آگهی‌ها</h2>
                <div class="filter-group">
                    <select id="categoryFilter">
                        <option value="all">همه دسته‌ها</option>
                        <option value="املاک">املاک</option>
                        <option value="خودرو">خودرو</option>
                        <option value="الکترونیک">الکترونیک</option>
                        <option value="خدمات">خدمات</option>
                        <option value="عمومی">عمومی</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="جستجو..." style="width:120px;">
                </div>
            </div>
            <div id="adsList">
                <div class="text-center text-secondary">در حال بارگذاری...</div>
            </div>
        </div>

        <!-- PROFILE PAGE -->
        <div id="profilePage" class="page">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div class="profile-info">
                    <h2 id="profileFullName">کاربر</h2>
                    <div class="username-hidden">
                        <span id="profileUsernameHidden">••••••</span>
                        <button id="revealUsernameBtn"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
            </div>
            <div class="profile-stats">
                <div class="stat-item"><div class="num" id="profileBalance">0</div><div class="label">موجودی (تومان)</div></div>
                <div class="stat-item"><div class="num" id="profileTrust">50</div><div class="label">امتیاز اعتماد</div></div>
                <div class="stat-item"><div class="num" id="profileVip">خیر</div><div class="label">VIP</div></div>
            </div>
            <div class="profile-actions">
                <button id="profileMyAds"><i class="fas fa-list-ul"></i> آگهی‌های من</button>
                <button id="profileWallet"><i class="fas fa-wallet"></i> کیف پول</button>
                <button id="profileFavorites"><i class="fas fa-heart"></i> علاقه‌مندی‌ها</button>
                <button id="profileSupport"><i class="fas fa-headset"></i> پشتیبانی</button>
                <button id="profileLogout" class="danger"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
            <div id="profileExtra" style="margin-top:12px;"></div>
        </div>

        <!-- ADMIN PAGE -->
        <div id="adminPage" class="page">
            <h3>🔧 پنل مدیریت</h3>
            <div class="admin-grid">
                <button id="adminPendingAds"><i class="fas fa-clock"></i> تایید آگهی</button>
                <button id="adminAllAds"><i class="fas fa-ads"></i> همه آگهی‌ها</button>
                <button id="adminUsers"><i class="fas fa-users"></i> کاربران</button>
                <button id="adminAdmins"><i class="fas fa-user-shield"></i> ادمین‌ها</button>
                <button id="adminGift"><i class="fas fa-gift"></i> هدیه</button>
                <button id="adminAnnounce"><i class="fas fa-bullhorn"></i> اطلاعیه</button>
                <button id="adminStats"><i class="fas fa-chart-bar"></i> آمار</button>
                <button id="adminSettings"><i class="fas fa-cog"></i> تنظیمات</button>
                <button id="adminExport"><i class="fas fa-file-excel"></i> خروجی</button>
                <button id="adminSearch"><i class="fas fa-search"></i> جستجو</button>
            </div>
            <div id="adminContent" class="admin-section">
                <h4>مدیریت سریع</h4>
                <div class="admin-row">
                    <input type="text" id="adminQuickInput" placeholder="شناسه آگهی / نام کاربری">
                    <button id="adminQuickApprove">تایید</button>
                    <button id="adminQuickReject">رد</button>
                    <button id="adminQuickBlock">مسدود</button>
                </div>
                <div id="adminResult" style="margin-top:10px;"></div>
            </div>
        </div>

        <!-- ===== TAB BAR ===== -->
        <div class="tab-bar" id="tabBar">
            <button class="active" data-page="homePage"><i class="fas fa-home"></i> خانه</button>
            <button data-page="profilePage"><i class="fas fa-user"></i> پروفایل</button>
            <button data-page="adminPage" id="adminTabBtn" style="display:none;"><i class="fas fa-crown"></i> مدیریت</button>
        </div>

    </div>

    <!-- ============================================================
    AD DETAIL MODAL
    ============================================================ -->
    <div class="modal-overlay" id="adModal">
        <div class="modal-content" id="adModalContent">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            <div id="modalBody">
                <div class="text-center text-secondary">در حال بارگذاری...</div>
            </div>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // STATE
        // ============================================================
        const state = {
            username: null,
            phone: null,
            lang: 'fa',
            isAdmin: false,
            currentPage: 'authPage',
            captchaCode: '',
            ads: [],
            currentAdId: null,
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const toast = $('toast');
        const authPage = $('authPage');
        const homePage = $('homePage');
        const profilePage = $('profilePage');
        const adminPage = $('adminPage');
        const authUsername = $('authUsername');
        const authPhone = $('authPhone');
        const authCode = $('authCode');
        const codeGroup = $('codeGroup');
        const sendCodeBtn = $('sendCodeBtn');
        const authSubmitBtn = $('authSubmitBtn');
        const authToggleLink = $('authToggleLink');
        const authToggleText = $('authToggleText');
        const captchaCodeEl = $('captchaCode');
        const refreshCaptcha = $('refreshCaptcha');
        const adsList = $('adsList');
        const categoryFilter = $('categoryFilter');
        const searchInput = $('searchInput');
        const userBadge = $('userBadge');
        const userBadgeName = $('userBadgeName');
        const profileAvatar = $('profileAvatar');
        const profileFullName = $('profileFullName');
        const profileUsernameHidden = $('profileUsernameHidden');
        const revealUsernameBtn = $('revealUsernameBtn');
        const profileBalance = $('profileBalance');
        const profileTrust = $('profileTrust');
        const profileVip = $('profileVip');
        const profileExtra = $('profileExtra');
        const modalOverlay = $('adModal');
        const modalBody = $('modalBody');
        const modalClose = $('modalClose');
        const adminTabBtn = $('adminTabBtn');
        const adminContent = $('adminContent');
        const adminResult = $('adminResult');
        const adminQuickInput = $('adminQuickInput');
        const themeToggle = $('themeToggle');
        const langToggle = $('langToggle');

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function showLoading(el) {
            el.innerHTML = '<div class="loading-spinner"></div>';
        }

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            state.captchaCode = code;
            captchaCodeEl.textContent = code;
        }

        function getApiUrl(path) {
            // اگر در محیط لوکال هستید، از پروکسی یا آدرس کامل استفاده کنید
            // در اینجا فرض می‌کنیم Worker روی همان دامنه یا از طریق CORS در دسترس است
            return path;
        }

        async function apiCall(method, path, body = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' },
            };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(getApiUrl(path), options);
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'خطا در ارتباط با سرور');
            return data;
        }

        // ============================================================
        // AUTH
        // ============================================================
        let authMode = 'register'; // 'register' or 'login'

        function setAuthMode(mode) {
            authMode = mode;
            if (mode === 'register') {
                authToggleText.textContent = 'قبلاً ثبت‌نام کرده‌اید؟';
                authToggleLink.textContent = 'ورود';
                authSubmitBtn.textContent = 'ثبت‌نام';
            } else {
                authToggleText.textContent = 'ثبت‌نام نکرده‌اید؟';
                authToggleLink.textContent = 'ثبت‌نام';
                authSubmitBtn.textContent = 'ورود';
            }
            codeGroup.style.display = 'none';
            authCode.value = '';
        }

        authToggleLink.addEventListener('click', () => {
            setAuthMode(authMode === 'register' ? 'login' : 'register');
        });

        sendCodeBtn.addEventListener('click', async () => {
            const username = authUsername.value.trim();
            const phone = authPhone.value.trim();
            if (!username || username.length < 3) {
                showToast('نام کاربری حداقل ۳ کاراکتر', 'error');
                return;
            }
            if (!phone || phone.length < 10) {
                showToast('شماره تلفن معتبر وارد کنید', 'error');
                return;
            }
            // captcha check
            if (authCode.value.toUpperCase() !== state.captchaCode) {
                showToast('کد امنیتی اشتباه است', 'error');
                generateCaptcha();
                return;
            }
            try {
                const endpoint = authMode === 'register' ? '/api/register' : '/api/login';
                const res = await apiCall('POST', endpoint, { username, phone, lang: state.lang });
                if (res.success) {
                    showToast('کد تایید ارسال شد!');
                    // Store username/phone temporarily
                    state._tempUsername = username;
                    state._tempPhone = phone;
                    codeGroup.style.display = 'block';
                    authCode.focus();
                    // change button to verify
                    authSubmitBtn.textContent = 'تایید کد';
                    // store mode for final step
                    state._authStep = 'verify';
                } else {
                    showToast(res.error || 'خطا', 'error');
                }
            } catch (e) {
                showToast(e.message, 'error');
            }
        });

        authSubmitBtn.addEventListener('click', async () => {
            // If we are in verification step
            if (state._authStep === 'verify') {
                const code = authCode.value.trim();
                if (!code || code.length < 6) {
                    showToast('کد ۶ رقمی را وارد کنید', 'error');
                    return;
                }
                try {
                    const res = await apiCall('POST', '/api/verify', {
                        username: state._tempUsername,
                        code: code
                    });
                    if (res.success) {
                        showToast('✅ ورود موفق!');
                        state.username = state._tempUsername;
                        state.phone = state._tempPhone;
                        // Check if admin
                        await checkAdmin();
                        enterApp();
                    } else {
                        showToast(res.error || 'کد نامعتبر', 'error');
                    }
                } catch (e) {
                    showToast(e.message, 'error');
                }
                return;
            }

            // Otherwise first step: send code
            sendCodeBtn.click();
        });

        // ============================================================
        // CHECK ADMIN
        // ============================================================
        async function checkAdmin() {
            if (!state.username) return false;
            try {
                // we don't have a direct /api/admin/check, but we can try to get stats or just check if user in admins
                // Simulate by trying to call admin stats (will fail if not admin)
                const res = await apiCall('GET', '/api/admin/stats');
                if (res.success) {
                    state.isAdmin = true;
                    adminTabBtn.style.display = 'flex';
                    return true;
                }
            } catch (e) {
                state.isAdmin = false;
                adminTabBtn.style.display = 'none';
            }
            return false;
        }

        // ============================================================
        // ENTER APP
        // ============================================================
        function enterApp() {
            authPage.classList.remove('active');
            homePage.classList.add('active');
            profilePage.classList.remove('active');
            adminPage.classList.remove('active');
            state.currentPage = 'homePage';
            userBadge.style.display = 'flex';
            userBadgeName.textContent = state.username;
            // Load ads
            loadAds();
            loadProfile();
            // show admin tab if admin
            if (state.isAdmin) {
                adminTabBtn.style.display = 'flex';
            }
            // Update tabs
            document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-page="homePage"]').classList.add('active');
        }

        // ============================================================
        // LOAD ADS
        // ============================================================
        async function loadAds() {
            try {
                const data = await apiCall('GET', '/api/ads');
                state.ads = data.data || [];
                renderAds(state.ads);
            } catch (e) {
                showToast('خطا در بارگذاری آگهی‌ها', 'error');
                adsList.innerHTML = '<div class="text-center text-secondary">خطا در بارگذاری</div>';
            }
        }

        function renderAds(ads) {
            if (!ads || ads.length === 0) {
                adsList.innerHTML = '<div class="text-center text-secondary">📭 هیچ آگهی‌ای وجود ندارد</div>';
                return;
            }
            let html = '';
            for (const ad of ads) {
                const isSpecial = ad.ad_type === 'special' && ad.special_expiry > Math.floor(Date.now() / 1000);
                html += `
                    <div class="ad-card" data-id="${ad.id}">
                        ${isSpecial ? '<div class="ad-badge special">⭐ ویژه</div>' : ''}
                        <div class="ad-title">${ad.title}</div>
                        <div class="ad-meta">
                            <span><i class="fas fa-tag"></i> ${ad.category || 'عمومی'}</span>
                            <span><i class="fas fa-map-pin"></i> ${ad.city || 'نامشخص'}</span>
                            <span><i class="fas fa-clock"></i> ${timeAgo(ad.created_at)}</span>
                        </div>
                        <div class="ad-footer">
                            <span class="ad-price">${Number(ad.price).toLocaleString()} تومان</span>
                            <div class="likes-comments">
                                <span><i class="fas fa-heart" style="color:#e74c3c;"></i> ${ad.likeCount || 0}</span>
                                <span><i class="fas fa-comment"></i> ${ad.commentCount || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            adsList.innerHTML = html;
            // click event
            document.querySelectorAll('.ad-card').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    openAdDetail(id);
                });
            });
        }

        function timeAgo(ts) {
            if (!ts) return 'لحظاتی پیش';
            const diff = Math.floor(Date.now() / 1000) - ts;
            if (diff < 60) return 'لحظاتی پیش';
            if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه پیش';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت پیش';
            if (diff < 604800) return Math.floor(diff / 86400) + ' روز پیش';
            return Math.floor(diff / 86400) + ' روز پیش';
        }

        // ============================================================
        // AD DETAIL MODAL
        // ============================================================
        async function openAdDetail(adId) {
            modalOverlay.classList.add('open');
            modalBody.innerHTML = '<div class="loading-spinner"></div>';
            state.currentAdId = adId;
            try {
                const data = await apiCall('GET', `/api/ad/detail/${adId}`);
                const ad = data.data;
                if (!ad) throw new Error('آگهی یافت نشد');
                renderAdDetail(ad);
            } catch (e) {
                modalBody.innerHTML = `<div class="text-center text-secondary">❌ ${e.message}</div>`;
            }
        }

        function renderAdDetail(ad) {
            const isSpecial = ad.ad_type === 'special' && ad.special_expiry > Math.floor(Date.now() / 1000);
            const likers = ad.likers || [];
            const isLiked = state.username && likers.includes(state.username);
            const comments = ad.comments || [];

            let html = `
                <div class="ad-title-lg">${ad.title} ${isSpecial ? '⭐' : ''}</div>
                <div class="ad-meta-lg">
                    <span><i class="fas fa-user"></i> ${ad.userFullname || ad.username}</span>
                    <span><i class="fas fa-tag"></i> ${ad.category || 'عمومی'}</span>
                    <span><i class="fas fa-map-pin"></i> ${ad.city || 'نامشخص'}</span>
                    <span><i class="fas fa-clock"></i> ${timeAgo(ad.created_at)}</span>
                </div>
                <div class="ad-price-lg">${Number(ad.price).toLocaleString()} تومان</div>
                <div class="ad-desc">${ad.description || 'توضیحی وارد نشده است.'}</div>
                <div class="ad-interact">
                    <button id="modalLikeBtn" class="${isLiked ? 'liked' : ''}">
                        <i class="fas fa-heart"></i> <span id="modalLikeCount">${ad.likeCount || 0}</span>
                    </button>
                    <button id="modalFavoriteBtn"><i class="fas fa-bookmark"></i> ذخیره</button>
                    <button id="modalShareBtn"><i class="fas fa-share-alt"></i> اشتراک</button>
                </div>
                <div class="comment-section">
                    <div id="modalComments">
                        ${comments.length === 0 ? '<div class="text-secondary text-center">هنوز نظری ثبت نشده است.</div>' : ''}
                        ${comments.map(c => `
                            <div class="comment-item">
                                <span class="comment-user">${c.fullname || c.username}</span>
                                <span>${c.text}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="comment-input-row">
                        <input type="text" id="modalCommentInput" placeholder="نظر خود را بنویسید...">
                        <button id="modalCommentSend">ارسال</button>
                    </div>
                </div>
            `;
            modalBody.innerHTML = html;

            // Like button
            document.getElementById('modalLikeBtn').addEventListener('click', async () => {
                if (!state.username) { showToast('لطفاً وارد شوید', 'error'); return; }
                try {
                    const action = isLiked ? 'unlike' : 'like';
                    const res = await apiCall('POST', `/api/ad/${action}`, { adId: ad.id, username: state.username });
                    if (res.success) {
                        // refresh detail
                        openAdDetail(ad.id);
                    }
                } catch (e) {
                    showToast(e.message, 'error');
                }
            });

            // Favorite
            document.getElementById('modalFavoriteBtn').addEventListener('click', async () => {
                if (!state.username) { showToast('لطفاً وارد شوید', 'error'); return; }
                try {
                    const res = await apiCall('POST', '/api/favorite/add', { username: state.username, adId: ad.id });
                    showToast('به علاقه‌مندی اضافه شد');
                } catch (e) {
                    showToast(e.message, 'error');
                }
            });

            // Share
            document.getElementById('modalShareBtn').addEventListener('click', () => {
                const url = `https://www.j-dar.ir/ad/${ad.id}`;
                if (navigator.share) {
                    navigator.share({ title: ad.title, text: ad.title, url });
                } else {
                    navigator.clipboard.writeText(url).then(() => showToast('لینک کپی شد!'));
                }
            });

            // Comment
            document.getElementById('modalCommentSend').addEventListener('click', async () => {
                const input = document.getElementById('modalCommentInput');
                const text = input.value.trim();
                if (!text) { showToast('متن نظر را وارد کنید', 'error'); return; }
                if (!state.username) { showToast('لطفاً وارد شوید', 'error'); return; }
                try {
                    await apiCall('POST', '/api/ad/comment', { adId: ad.id, username: state.username, comment: text });
                    input.value = '';
                    openAdDetail(ad.id);
                } catch (e) {
                    showToast(e.message, 'error');
                }
            });
        }

        modalClose.addEventListener('click', () => modalOverlay.classList.remove('open'));
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('open');
        });

        // ============================================================
        // PROFILE
        // ============================================================
        async function loadProfile() {
            if (!state.username) return;
            try {
                const data = await apiCall('GET', `/api/profile/${state.username}`);
                const user = data.data;
                if (!user) return;
                profileFullName.textContent = user.fullname || user.username;
                profileAvatar.textContent = (user.fullname || user.username)[0].toUpperCase();
                profileUsernameHidden.textContent = '••••••';
                profileBalance.textContent = Number(user.balance || 0).toLocaleString();
                profileTrust.textContent = user.trustScore || 50;
                const isVip = user.isVip && user.vipExpiry > Math.floor(Date.now() / 1000);
                profileVip.textContent = isVip ? '✅ فعال' : '❌ غیرفعال';
                // store full user data
                state._profile = user;
            } catch (e) {
                showToast('خطا در بارگذاری پروفایل', 'error');
            }
        }

        revealUsernameBtn.addEventListener('click', () => {
            if (state._profile && state._profile.username) {
                profileUsernameHidden.textContent = state._profile.username;
                setTimeout(() => {
                    profileUsernameHidden.textContent = '••••••';
                }, 5000);
            }
        });

        // Profile actions
        document.getElementById('profileMyAds').addEventListener('click', () => {
            if (!state.username) return;
            // show user's ads in extra
            profileExtra.innerHTML = '<div class="loading-spinner"></div>';
            apiCall('GET', `/api/ads?username=${state.username}`)
                .then(res => {
                    const ads = res.data || [];
                    if (ads.length === 0) {
                        profileExtra.innerHTML = '<div class="text-secondary">شما هیچ آگهی‌ای ندارید.</div>';
                        return;
                    }
                    let html = '<div class="admin-section"><h4>آگهی‌های شما</h4>';
                    ads.forEach(a => {
                        html += `<div class="ad-card" style="padding:12px;margin-bottom:8px;">
                            <div>${a.title} - ${Number(a.price).toLocaleString()} تومان</div>
                            <div class="text-secondary" style="font-size:12px;">وضعیت: ${a.status}</div>
                        </div>`;
                    });
                    html += '</div>';
                    profileExtra.innerHTML = html;
                })
                .catch(() => profileExtra.innerHTML = '<div class="text-secondary">خطا در بارگذاری</div>');
        });

        document.getElementById('profileWallet').addEventListener('click', () => {
            if (!state.username) return;
            profileExtra.innerHTML = '<div class="loading-spinner"></div>';
            apiCall('GET', `/api/transactions/${state.username}`)
                .then(res => {
                    const txs = res.data || [];
                    let html = `
                        <div class="wallet-card">
                            <div class="label">موجودی کیف پول</div>
                            <div class="balance">${Number(state._profile?.balance || 0).toLocaleString()} تومان</div>
                        </div>
                        <div class="wallet-actions">
                            <button id="chargeBtn"><i class="fas fa-plus-circle"></i> شارژ</button>
                            <button id="buyVipBtn"><i class="fas fa-crown"></i> خرید VIP</button>
                        </div>
                        <div class="admin-section"><h4>تراکنش‌ها</h4>
                    `;
                    if (txs.length === 0) html += '<div class="text-secondary">هیچ تراکنشی وجود ندارد</div>';
                    txs.forEach(t => {
                        html += `<div class="comment-item" style="border-bottom:1px solid #eee;padding:6px 0;">
                            <span>${t.type} - ${Number(t.amount).toLocaleString()} تومان</span>
                            <span style="margin-right:auto;font-size:12px;color:var(--text-secondary)">${t.status}</span>
                        </div>`;
                    });
                    html += '</div>';
                    profileExtra.innerHTML = html;
                    // Charge button
                    document.getElementById('chargeBtn').addEventListener('click', () => {
                        const amount = prompt('مبلغ شارژ (تومان):');
                        if (!amount || isNaN(amount) || amount < 1000) { showToast('مبلغ نامعتبر', 'error'); return; }
                        apiCall('POST', '/api/charge', { username: state.username, amount: Number(amount) })
                            .then(() => { showToast('درخواست شارژ ثبت شد'); loadProfile(); })
                            .catch(e => showToast(e.message, 'error'));
                    });
                    document.getElementById('buyVipBtn').addEventListener('click', () => {
                        const plan = prompt('پلن VIP (monthly, quarterly, semiannual):');
                        if (!plan) return;
                        apiCall('POST', '/api/vip/buy', { username: state.username, plan })
                            .then(() => { showToast('VIP خریداری شد'); loadProfile(); })
                            .catch(e => showToast(e.message, 'error'));
                    });
                })
                .catch(() => profileExtra.innerHTML = '<div class="text-secondary">خطا در بارگذاری</div>');
        });

        document.getElementById('profileFavorites').addEventListener('click', () => {
            if (!state.username) return;
            profileExtra.innerHTML = '<div class="loading-spinner"></div>';
            apiCall('GET', `/api/favorites/${state.username}`)
                .then(res => {
                    const favs = res.data || [];
                    if (favs.length === 0) {
                        profileExtra.innerHTML = '<div class="text-secondary">هیچ علاقه‌مندی وجود ندارد</div>';
                        return;
                    }
                    let html = '<div class="admin-section"><h4>علاقه‌مندی‌ها</h4>';
                    favs.forEach(a => {
                        html += `<div class="ad-card" style="padding:12px;margin-bottom:8px;">
                            ${a.title} - ${Number(a.price).toLocaleString()} تومان
                        </div>`;
                    });
                    html += '</div>';
                    profileExtra.innerHTML = html;
                })
                .catch(() => profileExtra.innerHTML = '<div class="text-secondary">خطا در بارگذاری</div>');
        });

        document.getElementById('profileSupport').addEventListener('click', () => {
            const msg = prompt('پیام خود را برای پشتیبانی بنویسید:');
            if (!msg) return;
            apiCall('POST', '/api/support/ticket', { username: state.username, message: msg })
                .then(() => showToast('پیام شما ثبت شد'))
                .catch(e => showToast(e.message, 'error'));
        });

        document.getElementById('profileLogout').addEventListener('click', () => {
            if (confirm('آیا از خروج اطمینان دارید؟')) {
                state.username = null;
                state.phone = null;
                state.isAdmin = false;
                userBadge.style.display = 'none';
                adminTabBtn.style.display = 'none';
                authPage.classList.add('active');
                homePage.classList.remove('active');
                profilePage.classList.remove('active');
                adminPage.classList.remove('active');
                state.currentPage = 'authPage';
                setAuthMode('register');
                // Reset auth step
                state._authStep = null;
                codeGroup.style.display = 'none';
                authSubmitBtn.textContent = 'ثبت‌نام / ورود';
                showToast('خارج شدید');
            }
        });

        // ============================================================
        // ADMIN FUNCTIONS
        // ============================================================
        document.getElementById('adminPendingAds').addEventListener('click', async () => {
            if (!state.isAdmin) { showToast('دسترسی غیرمجاز', 'error'); return; }
            adminResult.innerHTML = '<div class="loading-spinner"></div>';
            try {
                const res = await apiCall('GET', '/api/ads?status=pending');
                const ads = res.data || [];
                if (ads.length === 0) {
                    adminResult.innerHTML = '<div class="text-secondary">هیچ آگهی در انتظار تایید نیست</div>';
                    return;
                }
                let html = '<h4>آگهی‌های در انتظار</h4>';
                ads.forEach(a => {
                    html += `<div class="ad-card" style="padding:12px;margin-bottom:8px;">
                        <div><strong>${a.title}</strong> - ${a.username}</div>
                        <div class="admin-row" style="margin-top:6px;">
                            <button class="admin-approve" data-id="${a.id}">✅ تایید</button>
                            <button class="admin-reject" data-id="${a.id}">❌ رد</button>
                            <input type="text" class="admin-reason" placeholder="دلیل رد" style="flex:1;">
                        </div>
                    </div>`;
                });
                adminResult.innerHTML = html;
                // Approve
                document.querySelectorAll('.admin-approve').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        await apiCall('POST', '/api/admin/ad/approve', { adId: id, adminUsername: state
                            .username });
                        showToast('تایید شد');
                        document.getElementById('adminPendingAds').click();
                    });
                });
                document.querySelectorAll('.admin-reject').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const reason = btn.parentElement.querySelector('.admin-reason').value;
                        await apiCall('POST', '/api/admin/ad/reject', { adId: id, reason,
                            adminUsername: state.username });
                        showToast('رد شد');
                        document.getElementById('adminPendingAds').click();
                    });
                });
            } catch (e) {
                adminResult.innerHTML = `<div class="text-secondary">❌ ${e.message}</div>`;
            }
        });

        // Quick actions
        document.getElementById('adminQuickApprove').addEventListener('click', async () => {
            const input = adminQuickInput.value.trim();
            if (!input) { showToast('شناسه را وارد کنید', 'error'); return; }
            try {
                await apiCall('POST', '/api/admin/ad/approve', { adId: input, adminUsername: state.username });
                showToast('تایید شد');
                adminQuickInput.value = '';
            } catch (e) { showToast(e.message, 'error'); }
        });

        document.getElementById('adminQuickReject').addEventListener('click', async () => {
            const input = adminQuickInput.value.trim();
            if (!input) { showToast('شناسه را وارد کنید', 'error'); return; }
            const reason = prompt('دلیل رد:');
            try {
                await apiCall('POST', '/api/admin/ad/reject', { adId: input, reason, adminUsername: state.username });
                showToast('رد شد');
                adminQuickInput.value = '';
            } catch (e) { showToast(e.message, 'error'); }
        });

        document.getElementById('adminQuickBlock').addEventListener('click', async () => {
            const input = adminQuickInput.value.trim();
            if (!input) { showToast('نام کاربری را وارد کنید', 'error'); return; }
            const reason = prompt('دلیل مسدودیت:');
            try {
                await apiCall('POST', '/api/admin/block', { username: input, reason, adminUsername: state.username });
                showToast('کاربر مسدود شد');
                adminQuickInput.value = '';
            } catch (e) { showToast(e.message, 'error'); }
        });

        document.getElementById('adminAllAds').addEventListener('click', async () => {
            if (!state.isAdmin) return;
            adminResult.innerHTML = '<div class="loading-spinner"></div>';
            try {
                const res = await apiCall('GET', '/api/ads');
                const ads = res.data || [];
                let html = '<h4>همه آگهی‌ها</h4>';
                ads.forEach(a => {
                    html += `<div class="ad-card" style="padding:12px;margin-bottom:8px;">
                        ${a.title} - ${a.username} (${a.status})
                        <button class="admin-delete-ad" data-id="${a.id}" style="background:#e74c3c;color:#fff;padding:4px 12px;border-radius:8px;margin-right:8px;">حذف</button>
                    </div>`;
                });
                adminResult.innerHTML = html;
                document.querySelectorAll('.admin-delete-ad').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm('حذف شود؟')) return;
                        const id = btn.dataset.id;
                        await apiCall('POST', '/api/admin/ad/delete', { adId: id, reason: 'حذف توسط ادمین',
                            adminUsername: state.username });
                        showToast('حذف شد');
                        document.getElementById('adminAllAds').click();
                    });
                });
            } catch (e) { adminResult.innerHTML = `<div class="text-secondary">❌ ${e.message}</div>`; }
        });

        document.getElementById('adminStats').addEventListener('click', async () => {
            if (!state.isAdmin) return;
            try {
                const res = await apiCall('GET', '/api/admin/stats');
                const s = res.data;
                adminResult.innerHTML = `
                    <div class="admin-section">
                        <h4>آمار جـدار</h4>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                            <div>👥 کاربران: ${s.totalUsers}</div>
                            <div>📌 آگهی‌ها: ${s.totalAds}</div>
                            <div>👁️ بازدید: ${s.totalViews}</div>
                            <div>❤️ لایک: ${s.totalLikes}</div>
                            <div>💬 نظر: ${s.totalComments}</div>
                            <div>👑 VIP: ${s.vipUsers}</div>
                            <div>⏳ در انتظار: ${s.pendingAds}</div>
                            <div>⛔ مسدود: ${s.blockedUsers}</div>
                        </div>
                    </div>
                `;
            } catch (e) { adminResult.innerHTML = `<div class="text-secondary">❌ ${e.message}</div>`; }
        });

        document.getElementById('adminExport').addEventListener('click', () => {
            if (!state.isAdmin) return;
            window.open(getApiUrl('/api/admin/export?type=ads'), '_blank');
        });

        // ============================================================
        // NAVIGATION (TABS)
        // ============================================================
        document.querySelectorAll('.tab-bar button').forEach(btn => {
            btn.addEventListener('click', () => {
                const page = btn.dataset.page;
                if (!page) return;
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(page).classList.add('active');
                document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.currentPage = page;
                if (page === 'profilePage') loadProfile();
                if (page === 'homePage') loadAds();
                if (page === 'adminPage' && state.isAdmin) {
                    adminResult.innerHTML = '<div class="text-secondary">از دکمه‌های بالا استفاده کنید</div>';
                }
            });
        });

        // ============================================================
        // THEME & LANGUAGE
        // ============================================================
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const icon = themeToggle.querySelector('i');
            icon.className = document.body.classList.contains('dark') ? 'fas fa-sun' : 'fas fa-moon';
        });

        langToggle.addEventListener('click', () => {
            state.lang = state.lang === 'fa' ? 'ar' : 'fa';
            showToast(state.lang === 'fa' ? 'زبان به فارسی تغییر کرد' : 'تم تغيير اللغة إلى العربية');
            // simple translation placeholder (you can expand)
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.dataset.lang;
                // basic mapping
            });
        });

        // ============================================================
        // CAPTCHA
        // ============================================================
        refreshCaptcha.addEventListener('click', generateCaptcha);
        generateCaptcha();

        // ============================================================
        // SEARCH & FILTER
        // ============================================================
        searchInput.addEventListener('input', filterAds);
        categoryFilter.addEventListener('change', filterAds);

        function filterAds() {
            const query = searchInput.value.toLowerCase();
            const cat = categoryFilter.value;
            let filtered = state.ads;
            if (query) filtered = filtered.filter(a => a.title.toLowerCase().includes(query) || a.description?.toLowerCase()
                .includes(query));
            if (cat !== 'all') filtered = filtered.filter(a => a.category === cat);
            renderAds(filtered);
        }

        // ============================================================
        // INIT: check if already logged in (from localStorage)
        // ============================================================
        (function init() {
            const saved = localStorage.getItem('jdar_session');
            if (saved) {
                try {
                    const sess = JSON.parse(saved);
                    if (sess.username && sess.phone) {
                        state.username = sess.username;
                        state.phone = sess.phone;
                        // check admin
                        checkAdmin().then(() => {
                            enterApp();
                            loadProfile();
                        });
                        return;
                    }
                } catch (e) {}
            }
            // not logged in
            authPage.classList.add('active');
            homePage.classList.remove('active');
            profilePage.classList.remove('active');
            adminPage.classList.remove('active');
            setAuthMode('register');
        })();

        // Save session on login
        const origEnter = enterApp;
        enterApp = function() {
            if (state.username) {
                localStorage.setItem('jdar_session', JSON.stringify({ username: state.username, phone: state.phone }));
            }
            origEnter.call(this);
        };

        // Logout clears session
        document.getElementById('profileLogout').addEventListener('click', () => {
            localStorage.removeItem('jdar_session');
        });

        console.log('🚀 جـدار HTML با موفقیت بارگذاری شد!');
        console.log('📱 تمام قابلیت‌های Worker پوشش داده شده است.');
    </script>
</body>
    </html>
