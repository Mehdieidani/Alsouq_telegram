<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدار | J-DAR</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Vazir';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir.woff2') format('woff2');
            font-weight: normal;
        }
        @font-face {
            font-family: 'Vazir';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir-Bold.woff2') format('woff2');
            font-weight: bold;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', 'Inter', sans-serif;
            background: #0a0a0c;
            color: #fff;
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== پس‌زمینه متحرک با ذرات ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(123, 90, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 100, 150, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 200, 255, 0.05) 0%, transparent 70%);
            z-index: -2;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* ذرات درخشان */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 6px; height: 6px;
            background: rgba(123, 90, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 20px #7b5aff;
            animation: floatParticle 15s infinite alternate ease-in-out;
        }
        @keyframes floatParticle {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0.2; }
            100% { transform: translate(100px, -200px) scale(1.5); opacity: 0.8; }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 90px 16px;
            position: relative;
            z-index: 10;
        }

        /* ===== هدر ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 8px 12px;
            background: rgba(10, 10, 14, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.6);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #7b5aff, #a58aff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 10px 25px -5px rgba(123, 90, 255, 0.6);
            animation: glowPulse 2.5s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 20px rgba(123,90,255,0.3); }
            50% { box-shadow: 0 0 40px rgba(123,90,255,0.8); }
            100% { box-shadow: 0 0 20px rgba(123,90,255,0.3); }
        }

        .logo-text {
            font-weight: 800;
            font-size: 24px;
            background: linear-gradient(135deg, #fff, #d0b0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-left {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .icon-btn:hover {
            background: rgba(123, 90, 255, 0.2);
            color: #fff;
            transform: scale(1.05);
            border-color: #7b5aff;
            box-shadow: 0 0 25px rgba(123,90,255,0.3);
        }

        /* ===== کارت کیف پول ===== */
        .wallet-card {
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 24px 22px;
            margin-bottom: 25px;
            box-shadow: 0 25px 50px -20px rgba(0, 0, 0, 0.9);
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }
        .wallet-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(123,90,255,0.05), transparent 60%);
            pointer-events: none;
            animation: shine 6s infinite linear;
        }
        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .wallet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .wallet-info h4 {
            font-size: 14px;
            color: #aaa;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .wallet-info .amount {
            font-size: 34px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px rgba(123,90,255,0.3);
        }
        .wallet-info small {
            font-size: 14px;
            color: #7b5aff;
        }
        .wallet-points {
            background: rgba(123, 90, 255, 0.15);
            border: 1px solid rgba(123, 90, 255, 0.3);
            border-radius: 60px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a58aff;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(123,90,255,0.1);
        }
        .wallet-points i {
            color: #ffd966;
            font-size: 20px;
        }
        .wallet-points .points-num {
            font-weight: 700;
            font-size: 18px;
            color: #fff;
        }

        /* ===== اطلاعیه ===== */
        .notice-card {
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 40px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .notice-card:hover {
            border-color: #ffd966;
            box-shadow: 0 0 40px rgba(255,215,0,0.05);
        }
        .notice-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #daa520, #f0c040);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(218,165,32,0.3);
        }
        .notice-text {
            flex: 1;
            font-size: 14px;
            color: #ffd966;
            line-height: 1.6;
        }
        .notice-edit {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #daa520;
            font-size: 18px;
            transition: 0.3s;
            flex-shrink: 0;
            border: 1px solid rgba(218,165,32,0.2);
        }
        .notice-edit:hover {
            background: #daa520;
            color: #0a0a0c;
            transform: rotate(90deg);
        }

        /* ===== دکمه‌های سریع ===== */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .action-item {
            background: rgba(20, 20, 30, 0.3);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
        }
        .action-item:hover {
            background: rgba(123, 90, 255, 0.15);
            border-color: #7b5aff;
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(123,90,255,0.3);
        }
        .action-item i {
            font-size: 28px;
            background: linear-gradient(135deg, #a58aff, #7b5aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .action-item span {
            font-size: 11px;
            font-weight: 500;
            opacity: 0.8;
        }

        /* ===== جستجو ===== */
        .search-box {
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 6px 18px 6px 6px;
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            transition: 0.3s;
        }
        .search-box:focus-within {
            border-color: #7b5aff;
            box-shadow: 0 0 40px rgba(123,90,255,0.1);
        }
        .search-box i {
            color: #aaa;
            font-size: 20px;
            margin-left: 12px;
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
            padding: 12px 0;
        }
        .search-box input::placeholder {
            color: rgba(255,255,255,0.25);
        }
        .search-box button {
            background: linear-gradient(135deg, #7b5aff, #a58aff);
            border: none;
            border-radius: 60px;
            padding: 12px 24px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            box-shadow: 0 5px 20px rgba(123,90,255,0.3);
        }
        .search-box button:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(123,90,255,0.5);
        }

        /* ===== دسته‌بندی ===== */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-title h3 {
            font-weight: 600;
            font-size: 18px;
            color: #fff;
        }
        .section-title a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .section-title a:hover {
            color: #a58aff;
        }

        .categories {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 25px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }

        .category-chip {
            background: rgba(30, 30, 40, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 10px 24px;
            white-space: nowrap;
            color: #ddd;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 0.3px;
        }
        .category-chip.active {
            background: linear-gradient(135deg, #7b5aff, #a58aff);
            border-color: #7b5aff;
            color: white;
            box-shadow: 0 5px 25px rgba(123,90,255,0.4);
            transform: scale(1.02);
        }
        .category-chip:hover:not(.active) {
            background: rgba(123, 90, 255, 0.1);
            border-color: rgba(123,90,255,0.3);
            transform: translateY(-2px);
        }

        /* ===== کارت‌های آگهی ===== */
        .ads-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .ad-card {
            background: rgba(20, 20, 28, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 32px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px -15px rgba(0,0,0,0.5);
        }
        .ad-card:hover {
            transform: translateY(-12px) scale(1.01);
            border-color: rgba(123, 90, 255, 0.5);
            box-shadow: 0 30px 60px -15px rgba(123,90,255,0.4);
        }
        .ad-card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #12121a;
            position: relative;
            overflow: hidden;
        }
        .ad-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }
        .ad-card:hover .ad-card-image img {
            transform: scale(1.08);
        }
        .ad-card-image .watermark {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            color: white;
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .ad-card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .ad-card-title {
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
            min-height: 45px;
        }
        .ad-card-price {
            font-weight: 700;
            font-size: 16px;
            background: linear-gradient(135deg, #7b5aff, #a58aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .ad-card-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #aaa;
            flex-wrap: wrap;
        }
        .ad-card-meta i {
            font-size: 12px;
            color: #a58aff;
        }
        .special-badge {
            background: linear-gradient(135deg, #daa520, #f0c040);
            color: #0a0a0c;
            padding: 2px 12px;
            border-radius: 60px;
            font-size: 10px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 20px rgba(218,165,32,0.3);
        }

        .ad-card .favorite {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            transition: all 0.3s;
            z-index: 10;
            cursor: pointer;
            font-size: 18px;
        }
        .ad-card .favorite:hover {
            background: #ff5e7c;
            color: white;
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(255,94,124,0.4);
        }

        /* ===== مودال‌ها ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(30px);
            z-index: 1000;
            overflow-y: auto;
        }
        .modal.active { display: block; }

        .modal-content {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(10, 10, 14, 0.9);
            backdrop-filter: blur(30px);
            border: none;
            border-radius: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .modal-back {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #7b5aff;
            border: none;
            border-radius: 60px;
            width: 54px;
            height: 54px;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1001;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .modal-back:hover { transform: scale(1.1) rotate(-10deg); }

        .modal-content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 100px 20px;
        }

        .modal-image {
            width: 100%;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 50px -20px rgba(0,0,0,0.8);
        }

        .gallery-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }
        .gallery-controls button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 60px;
            width: 44px;
            height: 44px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        .gallery-controls button:hover {
            background: #7b5aff;
            border-color: #7b5aff;
            transform: scale(1.05);
        }
        .gallery-counter {
            color: #aaa;
            font-size: 14px;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin: 12px 0 6px;
            color: #fff;
            line-height: 1.3;
        }
        .modal-location-time {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 12px;
        }
        .modal-price {
            font-size: 22px;
            font-weight: 600;
            color: #7b5aff;
            margin: 8px 0 12px;
        }

        .modal-description {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 30px;
            padding: 16px;
            margin: 12px 0;
        }
        .description-text {
            color: #ddd;
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .description-text.truncated {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .read-more-btn {
            background: transparent;
            border: none;
            color: #7b5aff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 0;
            margin-top: 5px;
            display: block;
            text-align: left;
        }
        .read-more-btn:hover { text-decoration: underline; }

        .review-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 20px;
        }
        .review-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .review-header .avg {
            font-size: 24px;
            font-weight: bold;
            color: #ffd966;
        }
        .review-header .stars {
            color: #ffd966;
            font-size: 18px;
            letter-spacing: 2px;
        }
        .review-header .count {
            color: #aaa;
            font-size: 14px;
        }

        .review-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 30px;
            padding: 18px;
            margin-bottom: 15px;
        }
        .review-item .user {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .review-item .user i {
            background: #7b5aff;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .review-item .user-name { font-weight: 600; color: #fff; }
        .review-item .rating-stars { color: #ffd966; font-size: 16px; margin-bottom: 6px; }
        .review-item .comment { color: #ddd; font-size: 14px; margin-bottom: 6px; }
        .review-item .date { font-size: 11px; color: #aaa; }

        .review-input {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .review-input input,
        .review-input textarea {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 40px;
            padding: 14px 20px;
            color: white;
            width: 100%;
            resize: none;
            font-family: 'Vazir', sans-serif;
            transition: 0.3s;
        }
        .review-input input:focus,
        .review-input textarea:focus {
            border-color: #7b5aff;
            outline: none;
            box-shadow: 0 0 30px rgba(123,90,255,0.05);
        }
        .review-input button {
            background: linear-gradient(135deg, #7b5aff, #a58aff);
            color: white;
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-weight: bold;

    const API_BASE = 'https://souq-bot.mehdi11eidani.workers.dev';

    const translations = { /* ... همان ترجمه‌های قبلی ... */ };

    // ... تمام توابع دیگر (loadAds, renderAds, showAd, submitReview, ...) بدون تغییر ...

    let currentMainCat = 'پزشکی';
    let currentSubCat = '';
    function renderCategories() { const mainContainer = document.getElementById('mainCategoryList'); mainContainer.innerHTML = mainCategories.map(cat => `<span class="category-chip ${cat === currentMainCat ? 'active' : ''}" data-maincat="${cat}">${t('categories_list', cat)}</span>`).join(''); document.querySelectorAll('[data-maincat]').forEach(el => { el.addEventListener('click', () => { currentMainCat = el.dataset.maincat; currentSubCat = ''; renderCategories(); renderSubCategories(currentMainCat); filterAds(); }); }); renderSubCategories(currentMainCat); }
    function renderSubCategories(mainCat) { const subContainer = document.getElementById('subCategoryList'); const subs = subCategories[mainCat] || []; let html = `<span class="category-chip ${currentSubCat === '' ? 'active' : ''}" data-subcat="">${t('all')}</span>`; subs.forEach(sub => { const translated = t('categories_list', sub); html += `<span class="category-chip ${sub === currentSubCat ? 'active' : ''}" data-subcat="${sub}">${translated}</span>`; }); subContainer.innerHTML = html; document.querySelectorAll('[data-subcat]').forEach(el => { el.addEventListener('click', () => { currentSubCat = el.dataset.subcat || ''; document.querySelectorAll('[data-subcat]').forEach(c => c.classList.remove('active')); el.classList.add('active'); filterAds(); }); }); }
    // تکمیل توابع renderAds و ... (در فایل نهایی کامل خواهد بود)
</script>
