<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جـدار بازار - تست</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 16px 16px 80px;
            direction: rtl;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 16px;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #f7d875, #f5b81b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .refresh-btn {
            background: #16a34a;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
        .refresh-btn:hover { background: #15803d; }
        .ads-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .ad-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }
        .ad-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        .ad-card .image {
            width: 100%;
            aspect-ratio: 1/1;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 32px;
        }
        .ad-card .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ad-card .info {
            padding: 10px 12px;
        }
        .ad-card .info .title {
            font-weight: 700;
            font-size: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 38px;
        }
        .ad-card .info .price {
            font-weight: 700;
            font-size: 16px;
            color: #16a34a;
            margin-top: 2px;
        }
        .ad-card .info .meta {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .loading {
            text-align: center;
            padding: 40px 0;
            color: #16a34a;
        }
        .loading i { font-size: 32px; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .error-box {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 16px;
            color: #991b1b;
            margin: 12px 0;
        }
        .no-ads {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 9px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .bottom-nav .nav-item.active { color: #16a34a; }
        .bottom-nav .nav-item i { font-size: 22px; margin-bottom: 2px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">جـدار</div>
        <button class="refresh-btn" onclick="loadAds()"><i class="fa-solid fa-rotate"></i> بروزرسانی</button>
    </div>

    <div id="adsContainer">
        <div class="loading"><i class="fa-solid fa-spinner"></i><br>در حال بارگذاری...</div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item active"><i class="fa-solid fa-house"></i><span>خانه</span></button>
    <button class="nav-item"><i class="fa-solid fa-circle-plus"></i><span>ثبت</span></button>
    <button class="nav-item"><i class="fa-solid fa-heart"></i><span>علاقه‌مندی</span></button>
    <button class="nav-item"><i class="fa-solid fa-user"></i><span>پروفایل</span></button>
</div>

<script>
    // ============================================================
    // تنظیمات
    // ============================================================
    const API_BASE = 'https://souq-bot.mehdi11eidani.workers.dev/api';
    const IMAGE_BASE = 'https://souq-bot.mehdi11eidani.workers.dev/image/';
    const guestId = localStorage.getItem('jedar_guest_id') || 'guest_' + Math.random().toString(36).substring(2, 12);
    localStorage.setItem('jedar_guest_id', guestId);

    let allAds = [];

    // ============================================================
    // توابع کمکی
    // ============================================================
    function normalizeImageUrl(img) {
        if (!img) return null;
        if (img.startsWith('http://') || img.startsWith('https://')) return img;
        if (img.startsWith('/')) return API_BASE + img;
        return IMAGE_BASE + img;
    }

    function formatTime(ts) {
        if (!ts) return 'لحظاتی پیش';
        const now = Math.floor(Date.now() / 1000);
        const diff = now - ts;
        if (diff < 60) return 'لحظاتی پیش';
        if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه پیش';
        if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت پیش';
        if (diff < 604800) return Math.floor(diff / 86400) + ' روز پیش';
        return Math.floor(diff / 604800) + ' هفته پیش';
    }

    // ============================================================
    // دریافت و نمایش آگهی‌ها
    // ============================================================
    async function loadAds() {
        const container = document.getElementById('adsContainer');
        container.innerHTML = `<div class="loading"><i class="fa-solid fa-spinner"></i><br>در حال بارگذاری...</div>`;

        try {
            // 1. تلاش با /ads?status=approved
            let url = API_BASE + '/ads?status=approved';
            console.log('📡 درخواست به:', url);
            let response = await fetch(url);
            let data = await response.json();
            console.log('📡 پاسخ از /ads?status=approved:', data);

            // 2. اگر خالی بود، /ads را امتحان کن
            if (!data.success || !data.ads || data.ads.length === 0) {
                console.warn('⚠️ /ads?status=approved خالی بود، تلاش با /ads');
                url = API_BASE + '/ads';
                response = await fetch(url);
                data = await response.json();
                console.log('📡 پاسخ از /ads:', data);
            }

            // 3. اگر باز هم خالی بود، /myads را امتحان کن
            if (!data.success || !data.ads || data.ads.length === 0) {
                console.warn('⚠️ /ads خالی بود، تلاش با /myads');
                url = API_BASE + '/myads/' + guestId;
                response = await fetch(url);
                data = await response.json();
                console.log('📡 پاسخ از /myads:', data);
                // تبدیل داده‌های myads به ساختار ads
                if (data.success && data.data && data.data.length > 0) {
                    data.ads = data.data;
                }
            }

            // پردازش نهایی
            if (data.success && data.ads && data.ads.length > 0) {
                allAds = data.ads.map(ad => {
                    // پردازش تصاویر
                    if (ad.image_ids && typeof ad.image_ids === 'string') {
                        try { ad.image_ids = JSON.parse(ad.image_ids); } catch { ad.image_ids = []; }
                    } else if (!ad.image_ids) ad.image_ids = [];
                    if (ad.image_ids && Array.isArray(ad.image_ids)) {
                        ad.image_ids = ad.image_ids.map(img => normalizeImageUrl(img)).filter(url => url !== null);
                    } else ad.image_ids = [];
                    return ad;
                });
                renderAds(allAds);
            } else {
                container.innerHTML = `
                    <div class="no-ads">
                        <i class="fa-solid fa-image" style="font-size:48px;opacity:0.3;display:block;margin-bottom:12px;"></i>
                        <p>هیچ آگهی‌ای موجود نیست</p>
                        <p style="font-size:12px;margin-top:8px;">برای ثبت آگهی روی دکمه «ثبت» در پایین صفحه کلیک کنید.</p>
                    </div>
                `;
                console.error('❌ هیچ آگهی‌ای دریافت نشد:', data);
            }
        } catch (err) {
            console.error('❌ خطا در loadAds:', err);
            container.innerHTML = `
                <div class="error-box">
                    <i class="fa-solid fa-circle-exclamation"></i> خطا در بارگذاری آگهی‌ها
                    <div style="font-size:12px;margin-top:6px;color:#7f1d1d;">${err.message || 'خطای ناشناخته'}</div>
                    <button onclick="loadAds()" style="margin-top:8px;background:#16a34a;color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;">تلاش مجدد</button>
                </div>
            `;
        }
    }

    function renderAds(ads) {
        const container = document.getElementById('adsContainer');
        if (!ads || ads.length === 0) {
            container.innerHTML = `<div class="no-ads">هیچ آگهی‌ای موجود نیست</div>`;
            return;
        }

        let html = `<div class="ads-grid">`;
        ads.forEach(ad => {
            let imgHtml = '';
            if (ad.image_ids && ad.image_ids.length > 0) {
                imgHtml = `<img src="${ad.image_ids[0]}" onerror="this.parentElement.innerHTML='<i class=\\'fa-solid fa-image\\'></i>'" />`;
            } else {
                imgHtml = `<i class="fa-solid fa-image"></i>`;
            }
            html += `
                <div class="ad-card" onclick="alert('آگهی: ${ad.title || 'بدون عنوان'}')">
                    <div class="image">${imgHtml}</div>
                    <div class="info">
                        <div class="title">${ad.title || 'بدون عنوان'}</div>
                        <div class="price">${(ad.price || 0).toLocaleString()} تومان</div>
                        <div class="meta"><i class="fa-regular fa-clock"></i> ${formatTime(ad.created_at)}</div>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
        console.log(`✅ ${ads.length} آگهی نمایش داده شد`);
    }

    // ============================================================
    // اجرا
    // ============================================================
    loadAds();
</script>
</body>
</html>
