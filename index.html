<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدار | J-DAR</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== تمام استایل‌های قبلی به همین شکل ===== */
        /* (برای اختصار، استایل‌ها رو تکرار نمی‌کنم، ولی در فایل نهایی کامل هستند) */
        /* فقط مطمئن شو که کل استایل‌های قبلی رو داری */
    </style>
</head>
<body>
    <!-- ===== تمام HTML قبلی به همین شکل ===== -->
    <!-- (همه المان‌ها مثل قبل) -->

    <script>
        // ===== تمام کدهای قبلی =====
        // ... (همه متغیرها، ترجمه‌ها، توابع کمکی، و ...) ...

        // ===== اصلاح تابع showAd =====
        window.showAd = async (id) => {
            const ad = allAds.find(a => a.id == id);
            if (!ad) return;
            currentAdId = ad.id;
            const images = ad.image_ids ? (Array.isArray(ad.image_ids) ? ad.image_ids : JSON.parse(ad.image_ids)) : [];
            currentAdImages = images;
            const timeStr = getRelativeTime(ad.created_at);
            const locationTime = `${timeStr} در ${ad.city || ''}`;
            const priceDisplay = isNumericPrice(ad.price) ? `${ad.price} ${ad.currency}` : t('negotiable');

            // ===== چک کردن اطلاعات تماس =====
            const chatUsername = ad.telegram_username ? ad.telegram_username.trim() : '';
            const phoneNumber = ad.phone ? ad.phone.trim() : '';

            let reviewsHtml = '';
            let avgRating = ad.rating_avg ? ad.rating_avg.toFixed(1) : '0';
            let reviewCount = ad.rating_count || 0;
            try {
                const reviewsRes = await fetch(`${API_BASE}/api/reviews?adId=${id}`);
                const reviewsData = await reviewsRes.json();
                const reviews = reviewsData.reviews || [];
                reviewCount = reviews.length;
                if (reviews.length > 0) {
                    const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
                    avgRating = (sum / reviews.length).toFixed(1);
                }
                reviewsHtml = reviews.map(r => {
                    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                    return `
                        <div class="review-item">
                            <div class="user"><i class="fas fa-user-circle"></i> <span class="user-name">${r.first_name || r.username || 'کاربر'}</span></div>
                            <div class="rating-stars">${stars}</div>
                            <div class="comment">${r.comment || 'بدون نظر'}</div>
                            <div class="date">${new Date(r.created_at*1000).toLocaleDateString()}</div>
                        </div>
                    `;
                }).join('');
            } catch (e) { console.error('خطا در دریافت نظرات', e); }

            let galleryHtml = '';
            if (images.length > 0) {
                galleryHtml = `
                    <div class="image-gallery">
                        <img src="${API_BASE}/image/${images[0]}" class="modal-image" id="mainImage" onerror="this.src='https://via.placeholder.com/400x400?text=J-DAR'">
                        ${images.length > 1 ? `
                        <div class="gallery-controls">
                            <button id="prevImage"><i class="fas fa-chevron-right"></i></button>
                            <span class="gallery-counter" id="imageCounter">1/${images.length}</span>
                            <button id="nextImage"><i class="fas fa-chevron-left"></i></button>
                        </div>
                        ` : ''}
                    </div>
                `;
            } else {
                galleryHtml = `<img src="https://via.placeholder.com/400x400?text=J-DAR" class="modal-image">`;
            }

            const description = ad.description || '';
            const descriptionId = 'desc_' + ad.id;
            const readMoreId = 'readmore_' + ad.id;
            let descriptionHtml = '';
            if (description.length > 100) {
                descriptionHtml = `
                    <div class="modal-description">
                        <div class="description-text truncated" id="${descriptionId}">${description}</div>
                        <button class="read-more-btn" id="${readMoreId}" onclick="toggleReadMore('${descriptionId}', '${readMoreId}')">${t('readMore')}</button>
                    </div>
                `;
            } else {
                descriptionHtml = `<div class="modal-description">${description}</div>`;
            }

            // ===== ساخت مودال با چک کردن اطلاعات تماس =====
            const modalHtml = `
                <button class="modal-back" onclick="closeAdModal()"><i class="fas fa-arrow-right"></i></button>
                <div class="modal-content-scroll">
                    ${galleryHtml}
                    <div class="modal-title">${ad.title}</div>
                    <div class="modal-location-time">${locationTime}</div>
                    <div class="modal-price">💰 ${priceDisplay}</div>
                    ${descriptionHtml}
                    <div class="review-section">
                        <div class="review-header">
                            <span class="avg"><i class="fas fa-star"></i> ${avgRating}</span>
                            <span class="stars">${'★'.repeat(Math.round(parseFloat(avgRating)))}${'☆'.repeat(5 - Math.round(parseFloat(avgRating)))}</span>
                            <span class="count">(${reviewCount} ${t('reviewsCount')})</span>
                        </div>
                        ${reviewsHtml || '<p style="color:#aaa;">هنوز نظری ثبت نشده است.</p>'}
                        <div class="review-input">
                            <input type="number" id="newRating" min="1" max="5" placeholder="${t('ratingPlaceholder')}">
                            <textarea id="newComment" placeholder="${t('commentPlaceholder')}" rows="2"></textarea>
                            <button onclick="submitReview(${ad.id})"><i class="fas fa-paper-plane"></i> ${t('sendReview')}</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="contact-btn" onclick="showContact('${phoneNumber}')" ${!phoneNumber ? 'style="opacity:0.5;cursor:not-allowed;"' : ''}>
                        <i class="fas fa-phone-alt"></i> ${t('contactInfo')}
                    </button>
                    <button class="chat-btn" onclick="showChat('${chatUsername}')" ${!chatUsername ? 'style="opacity:0.5;cursor:not-allowed;"' : ''}>
                        <i class="fas fa-comment-dots"></i> ${t('chat')}
                    </button>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = modalHtml;
            document.getElementById('adModal').classList.add('active');
            if (tg) tg.BackButton.show();

            if (images.length > 1) {
                let currentIndex = 0;
                const mainImage = document.getElementById('mainImage');
                const prevBtn = document.getElementById('prevImage');
                const nextBtn = document.getElementById('nextImage');
                const counter = document.getElementById('imageCounter');

                if (prevBtn && nextBtn) {
                    prevBtn.addEventListener('click', () => {
                        currentIndex = (currentIndex - 1 + images.length) % images.length;
                        mainImage.src = `${API_BASE}/image/${images[currentIndex]}`;
                        if (counter) counter.innerText = (currentIndex+1) + '/' + images.length;
                    });
                    nextBtn.addEventListener('click', () => {
                        currentIndex = (currentIndex + 1) % images.length;
                        mainImage.src = `${API_BASE}/image/${images[currentIndex]}`;
                        if (counter) counter.innerText = (currentIndex+1) + '/' + images.length;
                    });
                }
            }
        };

        // ===== اصلاح تابع showChat =====
        function showChat(username) {
            if (!username || username === 'undefined' || username === '') {
                tg?.showPopup({ 
                    title: '💬', 
                    message: t('noUsername') || 'نام کاربری فروشنده ثبت نشده است' 
                });
                return;
            }
            tg?.openTelegramLink(`https://t.me/${username}`);
        }

        // ===== اصلاح تابع showContact (اختیاری) =====
        function showContact(phone) {
            if (!phone || phone === 'undefined' || phone === '') {
                tg?.showPopup({ 
                    title: '📞', 
                    message: t('noPhone') || 'شماره تماسی ثبت نشده است' 
                });
                return;
            }
            tg?.showPopup({
                title: '📞 ' + t('contactInfo'),
                message: phone,
                buttons: [
                    { id: 'call', type: 'default', text: t('call') },
                    { id: 'copy', type: 'default', text: t('copyHint') },
                    { type: 'cancel' }
                ]
            }, (btnId) => {
                if (btnId === 'call') window.location.href = `tel:${phone}`;
                else if (btnId === 'copy') {
                    navigator.clipboard.writeText(phone).then(() => tg?.showPopup({ title: '✅', message: t('copyHint') }));
                }
            });
        }

        // ===== بقیه کدها به همان شکل =====
        // ... (همه چیز دیگر مثل قبل) ...
    </script>
</body>
</html>
