<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>جـدار بازار</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== استایل‌ها (همانند قبل) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-primary: #f0f2f5;
            --bg-card: #ffffff;
            --bg-input: #f5f7fa;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aaa;
            --border-color: #e8ecf1;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            --ruby: #e74c3c;
            --ruby-dark: #c0392b;
            --ruby-light: #fde8e8;
            --ruby-glow: rgba(231,76,60,0.15);
            --green: #27ae60;
            --gold: #f39c12;
            --danger: #e74c3c;
            --transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
        }
        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-input: #2a2a42;
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c8;
            --text-muted: #7a7a9a;
            --border-color: #2a2a42;
        }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            direction: rtl;
            padding-bottom: 80px;
            overflow-x: hidden;
            transition: background var(--transition), color var(--transition);
        }
        button, input, textarea, select { font-family: var(--font); outline: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--ruby); border-radius: 10px; }

        /* ===== بقیه استایل‌ها (همانند قبل) ===== */
        .lang-overlay { /* ... */ }
        .toast-container { /* ... */ }
        .header { /* ... */ }
        /* ... و تمام استایل‌های قبلی ... */

        .logout-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            width: 100%;
            margin-top: 8px;
        }
        .logout-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(231,76,60,0.3); }

        .method-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }
        .method-badge.telegram { background: #e3f2fd; color: #0088cc; }
        .method-badge.email { background: #fce4ec; color: #ea4335; }
    </style>
</head>
<body>

    <!-- ===== انتخاب زبان ===== -->
    <div class="lang-overlay" id="langOverlay">...</div>

    <!-- ===== لودینگ ===== -->
    <div class="loading-overlay" id="loadingOverlay">...</div>

    <!-- ===== توست ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== بنر اسپلش ===== -->
    <div class="banner-overlay" id="bannerOverlay">...</div>

    <!-- ===== زوم تصویر ===== -->
    <div class="image-zoom-overlay" id="imageZoomOverlay">...</div>

    <!-- ===== فیلتر ===== -->
    <div class="filter-backdrop" id="filterBackdrop"></div>
    <div class="filter-modal" id="filterModal">...</div>

    <!-- ===== صفحه اصلی ===== -->
    <div id="app">
        <div class="header">...</div>
        <div class="search-box">...</div>
        <button class="filter-btn" onclick="openFilter()">...</button>
        <div class="categories-scroll" id="categoriesContainer"></div>
        <div id="bannerAdsContainer"></div>
        <div class="ads-grid" id="adsGrid"><div class="loading-spinner"><i class="fa-solid fa-spinner"></i></div></div>
    </div>

    <!-- ===== منوی پایین ===== -->
    <div class="bottom-nav">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
            <i class="fa-solid fa-house"></i><span class="nav-label" id="navHomeLabel">خانه</span>
        </button>
        <button class="nav-item" data-tab="add" onclick="openAddModal()">
            <i class="fa-solid fa-circle-plus"></i><span class="nav-label" id="navAddLabel">ثبت</span>
        </button>
        <button class="nav-item" data-tab="favorites" onclick="switchTab('favorites')">
            <i class="fa-solid fa-heart"></i><span class="nav-label" id="navFavLabel">نشان‌ها</span>
        </button>
        <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
            <i class="fa-solid fa-user"></i><span class="nav-label" id="navProfileLabel">پروفایل</span>
        </button>
        <div class="nav-item support-dropdown">
            <button onclick="toggleSupportMenu(event)" style="background:none;border:none;display:flex;flex-direction:column;align-items:center;color:var(--text-muted);cursor:pointer;font-family:var(--font);padding:0;min-width:44px;">
                <i class="fa-solid fa-headset"></i>
                <span class="nav-label" id="navSupportLabel">پشتیبانی</span>
            </button>
            <div class="dropdown-menu" id="supportDropdownMenu">...</div>
        </div>
    </div>

    <!-- ===== مودال ثبت آگهی ===== -->
    <div class="modal-overlay-old" id="addAdModal">...</div>

    <!-- ===== مودال جزئیات آگهی ===== -->
    <div class="modal-overlay" id="adDetailsModal">...</div>

    <!-- ===== تب پروفایل ===== -->
    <div id="profileTab">
        <h2 style="margin-bottom:14px;font-size:20px;font-weight:800;" id="profileTitle">👤 پروفایل</h2>
        <div class="profile-section">
            <div class="form-group">
                <label id="profileUsernameLabel">نام کاربری</label>
                <input type="text" id="profileUsername" placeholder="نام کاربری" readonly />
            </div>
            <div class="form-group">
                <label id="profileFullnameLabel">نام کامل</label>
                <input type="text" id="profileFullname" placeholder="نام و نام خانوادگی" />
            </div>
            <div class="form-group">
                <label id="profilePhoneLabel">📱 شماره تلفن (شناسه کاربری)</label>
                <input type="tel" id="profilePhone" placeholder="0912..." readonly />
            </div>
            <div class="form-group">
                <label id="profileEmailLabel">📧 ایمیل</label>
                <input type="email" id="profileEmail" placeholder="ایمیل" />
            </div>
            <div class="form-group">
                <label id="profileCityLabel">شهر</label>
                <input type="text" id="profileCity" placeholder="شهر محل سکونت" />
            </div>
            <div id="methodBadgeContainer" style="margin:4px 0;"></div>
            
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
                <button onclick="requestCodeViaTelegram()" id="telegramVerifyBtn" style="padding:12px;background:linear-gradient(135deg,#0088cc,#005f8a);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;">
                    ✈️ دریافت کد از تلگرام
                </button>
                <button onclick="requestCodeViaEmail()" id="emailVerifyBtn" style="padding:12px;background:linear-gradient(135deg,#ea4335,#c5221f);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;">
                    📧 دریافت کد از ایمیل
                </button>
            </div>
            
            <div id="verifyStatus" style="margin-top:12px;padding:10px;border-radius:8px;text-align:center;background:#fef3c7;color:#f39c12;font-size:13px;font-weight:600;">
                ⚠️ شماره خود را تأیید کنید
            </div>
            
            <div id="codeSection" style="display:none;margin-top:12px;padding:16px;background:#f8f9fa;border-radius:10px;border:1px solid #e8ecf1;">
                <div class="form-group">
                    <label id="codeInputLabel">🔑 کد ۶ رقمی را وارد کنید</label>
                    <input type="text" id="codeInput" maxlength="6" placeholder="مثال: ۱۲۳۴۵۶" style="text-align:center;letter-spacing:4px;font-size:22px;font-weight:700;" />
                </div>
                <button onclick="verifyCode()" id="verifyCodeBtn" style="width:100%;padding:12px;background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;">
                    ✅ تأیید کد
                </button>
                <button onclick="closeCodeSection()" id="cancelCodeBtn" style="width:100%;margin-top:8px;padding:10px;background:#f0f2f5;border:2px solid #e8ecf1;border-radius:10px;font-weight:600;color:#1a1a2e;cursor:pointer;">
                    ❌ انصراف
                </button>
            </div>
            
            <div class="profile-actions" style="margin-top:12px;">
                <button class="btn-save" id="profileSaveBtn" onclick="saveProfile()">💾 ذخیره</button>
                <button class="logout-btn" id="logoutBtn" onclick="logoutUser()" style="display:none;">🚪 خروج</button>
            </div>
        </div>
        
        <h3 style="margin:14px 0 8px;font-size:16px;font-weight:700;" id="myAdsTitle">📋 آگهی‌های من</h3>
        <div id="myAdsList"><div class="loading-spinner"><i class="fa-solid fa-spinner"></i></div></div>
        <h3 style="margin:14px 0 8px;font-size:16px;font-weight:700;" id="draftsTitle">📝 پیش‌نویس‌ها</h3>
        <div id="draftsList"><div class="text-secondary">هیچ پیش‌نویسی موجود نیست.</div></div>
    </div>

    <!-- ===== سایر تب‌ها (favorites, rules, support, about, guide, news, admin) ===== -->
    <div id="favoritesTab">...</div>
    <div id="rulesTab">...</div>
    <div id="supportTab">...</div>
    <div id="aboutTab">...</div>
    <div id="guideTab">...</div>
    <div id="newsTab">...</div>
    <div id="adminTab">...</div>

    <script>
        // ============================================================
        // CONSTANTS
        // ============================================================
        const API_BASE = 'https://souq-bot.mehdi11eidani.workers.dev/api';
        const IMAGE_BASE = 'https://souq-bot.mehdi11eidani.workers.dev/image/';

        let guestId = localStorage.getItem('jedar_guest_id');
        if (!guestId) {
            guestId = 'guest_' + Math.random().toString(36).substring(2, 12);
            localStorage.setItem('jedar_guest_id', guestId);
        }

        let allAds = [];
        let filteredAds = [];
        let favorites = [];
        let currentLang = localStorage.getItem('jedar_lang') || 'fa';
        let currentTheme = localStorage.getItem('jedar_theme') || 'light';
        let currentTab = 'home';
        let wizardStep = 1;
        let isUpdating = false;
        let userProfile = JSON.parse(localStorage.getItem('jedar_profile') || '{}');
        let isAdmin = false;
        let isSuperAdmin = false;
        let bannerShown = false;
        let bannerTimer = 5;
        let bannerTimerInterval = null;
        let reviewRating = 0;
        let toggleStatuses = {};
        let drafts = JSON.parse(localStorage.getItem('jedar_drafts') || '[]');
        let pendingMethod = '';
        let currentUserId = null;

        // ============================================================
        // ===== مدیریت نشست (Session) =====
        // ============================================================

        function getSessionId() {
            let sessionId = localStorage.getItem('jedar_session_id');
            if (!sessionId) {
                sessionId = 'session_' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('jedar_session_id', sessionId);
            }
            return sessionId;
        }

        function setSessionId(sessionId) {
            localStorage.setItem('jedar_session_id', sessionId);
        }

        function clearSession() {
            localStorage.removeItem('jedar_session_id');
            localStorage.removeItem('jedar_phone_verified');
            localStorage.removeItem('jedar_verified_phone');
            localStorage.removeItem('jedar_user_id');
            localStorage.removeItem('jedar_verify_method');
        }

        async function verifySession() {
            const sessionId = getSessionId();
            try {
                const res = await apiCall('/auth/verify-session', {
                    method: 'POST',
                    body: JSON.stringify({ sessionId })
                });
                if (res.success) {
                    localStorage.setItem('jedar_user_id', res.userId);
                    localStorage.setItem('jedar_verify_method', res.method || 'telegram');
                    return true;
                } else {
                    clearSession();
                    return false;
                }
            } catch (e) {
                clearSession();
                return false;
            }
        }

        async function loginWithPhone(phone, code) {
            try {
                // دریافت روش کاربر
                const methodRes = await apiCall(`/auth/method?phone=${phone}`);
                const method = methodRes.success ? methodRes.method : 'telegram';
                
                const res = await apiCall('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ phone, code })
                });
                if (res.success) {
                    setSessionId(res.sessionId);
                    localStorage.setItem('jedar_phone_verified', 'true');
                    localStorage.setItem('jedar_verified_phone', phone);
                    localStorage.setItem('jedar_user_id', res.userId);
                    localStorage.setItem('jedar_verify_method', res.method || method);
                    showToast('✅ ورود موفق', 'success');
                    loadProfile();
                    fetchAds(false);
                    return true;
                } else {
                    showToast(res.error || '❌ خطا در ورود', 'error');
                    return false;
                }
            } catch (e) {
                showToast('❌ خطا در ورود', 'error');
                return false;
            }
        }

        async function logoutUser() {
            const sessionId = getSessionId();
            try {
                await apiCall('/auth/logout', {
                    method: 'POST',
                    body: JSON.stringify({ sessionId })
                });
            } catch (e) {}
            clearSession();
            localStorage.removeItem('jedar_profile');
            userProfile = {};
            currentUserId = null;
            showToast('✅ خروج انجام شد', 'success');
            loadProfile();
            switchTab('home');
            document.getElementById('logoutBtn').style.display = 'none';
        }

        // ============================================================
        // ===== API CALL =====
        // ============================================================
        async function apiCall(endpoint, options = {}) {
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            const url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
            try {
                const res = await fetch(url, { ...options, headers });
                const text = await res.text();
                try { return JSON.parse(text); } catch (e) { throw new Error('پاسخ سرور معتبر نیست'); }
            } catch (err) {
                console.error('❌ API Error:', err);
                return { success: false, error: err.message || 'خطا در ارتباط با سرور' };
            }
        }

        // ============================================================
        // ===== TOAST & LOADING =====
        // ============================================================
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation' };
            toast.innerHTML =
                `<i class="fa-solid ${icons[type] || icons.success}"></i><span>${msg}</span><button class="close" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 30);
            setTimeout(() => { toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400); }, 4500);
        }

        function showLoading(show = true) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        function formatTime(ts) {
            if (!ts) return 'لحظاتی پیش';
            const diff = Math.floor(Date.now() / 1000) - ts;
            if (diff < 60) return 'لحظاتی پیش';
            if (diff < 120) return '۱ دقیقه پیش';
            if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه پیش';
            if (diff < 7200) return '۱ ساعت پیش';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت پیش';
            if (diff < 172800) return '۱ روز پیش';
            if (diff < 604800) return Math.floor(diff / 86400) + ' روز پیش';
            if (diff < 1209600) return '۱ هفته پیش';
            if (diff < 2592000) return Math.floor(diff / 604800) + ' هفته پیش';
            if (diff < 5184000) return '۱ ماه پیش';
            return Math.floor(diff / 2592000) + ' ماه پیش';
        }

        function normalizeImageUrl(img) {
            if (!img) return null;
            if (img.startsWith('http://') || img.startsWith('https://')) return img;
            if (img.startsWith('/')) return new URL(img, API_BASE).href;
            return `${IMAGE_BASE}${img}`;
        }

        // ============================================================
        // ===== VERIFICATION =====
        // ============================================================
        function isPhoneVerified() {
            return localStorage.getItem('jedar_phone_verified') === 'true';
        }

        function getUserId() {
            return localStorage.getItem('jedar_user_id') || guestId;
        }

        function requireVerifiedPhone() {
            if (!isPhoneVerified()) {
                showToast('⚠️ برای ثبت آگهی و نظر، ابتدا شماره خود را تأیید کنید.', 'warning');
                return false;
            }
            return true;
        }

        // ============================================================
        // ===== 2FA FUNCTIONS =====
        // ============================================================

        async function requestCodeViaTelegram() {
            const phone = document.getElementById('profilePhone').value.trim();
            if (!phone || phone.length < 10) {
                showToast('⚠️ شماره موبایل معتبر وارد کنید', 'error');
                return;
            }

            pendingMethod = 'telegram';
            const status = document.getElementById('verifyStatus');
            status.className = 'status-text info';
            status.textContent = '⏳ ارسال کد از طریق تلگرام...';
            status.style.background = '#e3f2fd';
            status.style.color = '#1a73e8';

            try {
                const res = await apiCall('/auth/send-2fa-telegram', {
                    method: 'POST',
                    body: JSON.stringify({ mobile: phone })
                });

                if (res.success) {
                    status.className = 'status-text success';
                    status.textContent = '✅ کد از طریق ربات تلگرام ارسال شد';
                    status.style.background = '#e8f5e9';
                    status.style.color = '#27ae60';
                    document.getElementById('codeSection').style.display = 'block';
                    document.getElementById('codeInput').focus();
                    showToast('✈️ کد ۶ رقمی از طریق تلگرام ارسال شد', 'success');
                } else if (res.action === 'start_bot') {
                    status.className = 'status-text warning';
                    status.textContent = '⚠️ ' + res.error;
                    status.style.background = '#fef3c7';
                    status.style.color = '#f39c12';
                    showToast('⚠️ ' + res.error, 'warning');
                    if (confirm('⚠️ لطفاً ابتدا ربات را استارت کنید و شماره خود را به ربات بفرستید.\n\nربات: @AlsouqAlmaftuhiran_bot\n\nآیا می‌خواهید ربات را باز کنید؟')) {
                        window.open('https://t.me/AlsouqAlmaftuhiran_bot', '_blank');
                    }
                } else {
                    status.className = 'status-text error';
                    status.textContent = '❌ ' + (res.error || 'خطا در ارسال کد');
                    status.style.background = '#fde8e8';
                    status.style.color = '#e74c3c';
                    showToast('❌ ' + (res.error || 'خطا در ارسال کد'), 'error');
                }
            } catch (e) {
                status.className = 'status-text error';
                status.textContent = '❌ خطا در ارتباط با سرور';
                status.style.background = '#fde8e8';
                status.style.color = '#e74c3c';
                showToast('❌ خطا در ارتباط با سرور', 'error');
            }
        }

        async function requestCodeViaEmail() {
            const email = document.getElementById('profileEmail').value.trim();
            if (!email || !email.includes('@')) {
                showToast('⚠️ ایمیل معتبر وارد کنید', 'error');
                return;
            }

            const phone = document.getElementById('profilePhone').value.trim();
            if (!phone || phone.length < 10) {
                showToast('⚠️ شماره تلفن را وارد کنید', 'error');
                return;
            }

            pendingMethod = 'email';
            const status = document.getElementById('verifyStatus');
            status.className = 'status-text info';
            status.textContent = '⏳ ارسال کد از طریق ایمیل...';
            status.style.background = '#e3f2fd';
            status.style.color = '#1a73e8';

            try {
                const res = await apiCall('/auth/send-2fa-email', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });

                if (res.success) {
                    status.className = 'status-text success';
                    status.textContent = `✅ کد به ایمیل ${email} ارسال شد`;
                    status.style.background = '#e8f5e9';
                    status.style.color = '#27ae60';
                    document.getElementById('codeSection').style.display = 'block';
                    document.getElementById('codeInput').focus();
                    showToast(`📧 کد ۶ رقمی به ${email} ارسال شد`, 'success');
                } else {
                    status.className = 'status-text error';
                    status.textContent = '❌ ' + (res.error || 'خطا در ارسال کد');
                    status.style.background = '#fde8e8';
                    status.style.color = '#e74c3c';
                    showToast('❌ ' + (res.error || 'خطا در ارسال کد'), 'error');
                }
            } catch (e) {
                status.className = 'status-text error';
                status.textContent = '❌ خطا در ارتباط با سرور';
                status.style.background = '#fde8e8';
                status.style.color = '#e74c3c';
                showToast('❌ خطا در ارتباط با سرور', 'error');
            }
        }

        async function verifyCode() {
            const phone = document.getElementById('profilePhone').value.trim();
            const code = document.getElementById('codeInput').value.trim();

            if (!code || code.length !== 6) {

        function switchTab(tab) {

            const navItem = document.querySelector(`.bottom-nav .nav-item[data-tab="${tab}"]`);
            if (navItem) navItem.classList.add('active');
            document.getElementById('app').style.display = 'none';
            document.getElementById('profileTab').style.display = 'none';
            document.getElementById('favoritesTab').style.display = 'none';
            document.getElementById('rulesTab').style.display = 'none';
            document.getElementById('supportTab').style.display = 'none';
            document.getElementById('aboutTab').style.display = 'none';
            document.getElementById('guideTab').style.display = 'none';
            document.getElementById('newsTab').style.display = 'none';
            document.getElementById('adminTab').style.display = 'none';
            document.getElementById('supportDropdownMenu').classList.remove('show');
            
            if (tab === 'home') {
                document.getElementById('app').style.display = 'block';
            } else if (tab === 'profile') {
                document.getElementById('profileTab').style.display = 'block';
                loadProfile();
                fetchMyAds();
                loadDrafts();
            } else if (tab === 'favorites') {
                document.getElementById('favoritesTab').style.display = 'block';
                fetchFavorites();
            } else if (tab === 'rules') {
                document.getElementById('rulesTab').style.display = 'block';
                loadRules();
            } else if (tab === 'support') {
                document.getElementById('supportTab').style.display = 'block';
                loadSupport();
            } else if (tab === 'about') {
                document.getElementById('aboutTab').style.display = 'block';
            } else if (tab === 'guide') {
                document.getElementById('guideTab').style.display = 'block';
            } else if (tab === 'news') {
                document.getElementById('newsTab').style.display = 'block';
            } else if (tab === 'admin') {
                document.getElementById('adminTab').style.display = 'block';
                if (isAdmin) {
                    document.getElementById('adminResult').innerHTML = '<div class="text-secondary">از دکمه‌های بالا استفاده کنید.</div>';
                } else {
                    showToast('⛔ دسترسی ندارید', 'error');
                    switchTab('home');
                }
            }
        }

        // ============================================================
        // ===== WIZARD =====
        // ============================================================
        function wizardNext() { if (wizardStep < 3) { wizardStep++;
                updateWizard(); } }
        function wizardPrev() { if (wizardStep > 1) { wizardStep--;
                updateWizard(); } }
        function updateWizard() {
            document.querySelectorAll('.wizard-step').forEach(el => el.classList.remove('active'));
            document.getElementById(`wizardStep${wizardStep}`).classList.add('active');
            document.getElementById('wizardBar').style.width = `${(wizardStep - 1) * 50}%`;
            for (let i = 1; i <= 3; i++) {
                const step = document.getElementById(`wStep${i}`);
                step.classList.remove('active', 'completed');
                if (i < wizardStep) step.classList.add('completed');
                if (i === wizardStep) step.classList.add('active');
            }
        }

        // ============================================================
        // ===== SUBMIT AD =====
        // ============================================================
        async function submitAd() {
            if (!requireVerifiedPhone()) return;
            // ... (بقیه کد submitAd مانند قبل)
            const title = document.getElementById('adTitle').value.trim();
            const category = document.getElementById('adCategory').value;
            const price = document.getElementById('adPrice').value;
            const desc = document.getElementById('adDescription').value.trim();
            const location = document.getElementById('adLocation').value.trim();
            const contact = userProfile.phone || '';
            const country = document.getElementById('adCountry').value;
            const durationDays = parseInt(document.getElementById('adDuration').value) || 30;
            const saveAsDraft = document.getElementById('saveAsDraft').checked;

            if (!title || !price || !desc || !location) {
                showToast('لطفاً تمام فیلدهای اجباری را پر کنید', 'warning');
                return;
            }
            if (!contact) {
                showToast('شماره تلفن تأیید شده در پروفایل یافت نشد.', 'error');
                return;
            }

            if (saveAsDraft) {
                const draft = { title, category, price, description: desc, city: location, country, duration: durationDays,
                    phone: contact, saved_at: Date.now() };
                drafts.push(draft);
                localStorage.setItem('jedar_drafts', JSON.stringify(drafts));
                showToast('پیش‌نویس ذخیره شد', 'success');
                closeModal('addAdModal');
                return;
            }

            const fileInput = document.getElementById('adImagesInput');
            const files = fileInput.files;
            if (!files || files.length === 0) {
                showToast('⚠️ لطفاً حداقل یک تصویر یا ویدیو انتخاب کنید', 'warning');
                return;
            }

            const btn = document.getElementById('submitAdBtn');
            btn.disabled = true;
            btn.innerHTML = 'در حال آپلود...';
            const statusEl = document.getElementById('uploadStatus');

            try {
                const imageIds = [];
                let mediaType = 'image';
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (imageIds.length >= 4) { showToast('حداکثر ۴ فایل مجاز است', 'warning'); break; }
                    if (file.size > 20 * 1024 * 1024) { showToast(`فایل ${file.name} بزرگتر از ۲۰ مگابایت است`, 'error'); continue; }
                    if (file.type.startsWith('video/')) mediaType = 'video';
                    statusEl.textContent = `در حال آپلود ${file.name}...`;
                    const formData = new FormData();
                    formData.append('photo', file);
                    const uploadRes = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
                    const uploadResult = await uploadRes.json();
                    if (uploadResult.success && uploadResult.file_id) {
                        imageIds.push(uploadResult.file_id);
                        showToast(`✅ ${file.name} آپلود شد`, 'success');
                    } else {
                        showToast(`❌ ${file.name}: ${uploadResult.error || 'خطا'}`, 'error');
                        btn.disabled = false;
                        btn.innerHTML = 'ثبت آگهی';
                        statusEl.textContent = '';
                        return;
                    }
                }
                if (imageIds.length === 0) {
                    showToast('❌ هیچ فایلی آپلود نشد', 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'ثبت آگهی';
                    statusEl.textContent = '';
                    return;
                }

                statusEl.textContent = '⏳ در حال ثبت آگهی...';
                btn.innerHTML = '⏳ در حال ثبت...';

                const userId = getUserId();
                const payload = {
                    username: userId,
                    title,
                    category,
                    price: parseInt(price),
                    description: desc,
                    city: location,
                    country,
                    phone: contact,
                    image_ids: imageIds,
                    duration_days: durationDays,
                    media_type: mediaType
                };

                const data = await apiCall('/ad/submit', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (data.success) {
                    showToast('✅ آگهی شما ثبت و برای تایید ارسال شد', 'success');
                    closeModal('addAdModal');
                    document.getElementById('addAdForm').reset();
                    document.getElementById('adImagePreview').innerHTML = '';
                    document.getElementById('adImagesInput').value = '';
                    statusEl.textContent = '';
                    fetchAds(true);
                    fetchMyAds();
                } else {
                    showToast(data.error || '❌ خطا در ثبت آگهی', 'error');
                }
            } catch (err) {
                showToast('❌ ' + err.message, 'error');

        document.getElementById('adImagesInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            const grid = document.getElementById('adImagePreview');
            grid.innerHTML = '';
            if (files.length > 4) { showToast('حداکثر ۴ فایل مجاز است', 'warning');
                this.value = '';
                return; }
            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const item = document.createElement('div');
                    item.className = 'image-preview-item';
                    const isVideo = file.type.startsWith('video/');
                    item.innerHTML = isVideo ?
                        `<video src="${ev.target.result}" muted style="width:100%;height:100%;object-fit:cover;"></video><span style="position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;font-size:8px;padding:2px 8px;border-radius:4px;"><i class="fa-solid fa-video"></i></span><button class="remove-img" onclick="removePreviewImage(${index})"><i class="fa-solid fa-xmark"></i></button>` :
                        `<img src="${ev.target.result}" /><button class="remove-img" onclick="removePreviewImage(${index})"><i class="fa-solid fa-xmark"></i></button>`;
                    grid.appendChild(item);
                };
                reader.readAsDataURL(file);
            });
        });

        function removePreviewImage(index) {
            const input = document.getElementById('adImagesInput');
            const dt = new DataTransfer();
            const files = Array.from(input.files);
            files.splice(index, 1);
            files.forEach(file => dt.items.add(file));
            input.files = dt.files;
            const event = new Event('change');
            input.dispatchEvent(event);
        }

                galleryHtml = `<div class="ad-gallery" onclick="event.stopPropagation();openMediaZoom('${galleryItems[0]}','${isVideo ? 'video' : 'image'}')">${isVideo ? `<video id="detailGalleryVideo" autoplay muted loop playsinline><source src="${galleryItems[0]}" type="video/mp4"></video>` : `<img id="detailGalleryImg" src="${galleryItems[0]}" onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'><i class=\\'fa-solid fa-image\\'></i></div>'" />`}</div>`;

                galleryHtml = `<div class="ad-gallery"><div class="no-image"><i class="fa-solid fa-image" style="font-size:40px;opacity:0.3;"></i></div></div>`;
            }
            const phone = ad.phone || '';
            const ratingAvg = ad.rating_avg ? Number(ad.rating_avg).toFixed(1) : '—';
            const isFav = favorites.includes(ad.id);

                <div class="modal-title">${ad.title || 'بدون عنوان'}</div>

                <div class="ad-price">${(ad.price || 0).toLocaleString()} تومان</div>

                    <span><i class="fa-regular fa-clock"></i> ${formatTime(ad.created_at)}</span>
                    <span>⭐ ${ratingAvg}</span>
                    ${ad.media_type === 'video' ? '<span><i class="fa-solid fa-video"></i></span>' : ''}

                <div class="ad-description">${ad.description || 'توضیحاتی وجود ندارد'}</div>

                    ${phone ? `<a href="https://wa.me/${phone.replace(/\s/g,'')}" target="_blank" class="btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> واتساپ</a>` : ''}
                    <button class="btn-share" onclick="shareAd(${ad.id}, '${ad.title}')"><i class="fa-solid fa-share-nodes"></i> اشتراک</button>
                </div>
                <button class="btn-fav" onclick="toggleFavoriteAndUpdateDetail(${ad.id})"><i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i> ${isFav ? 'حذف از نشان‌ها' : 'افزودن به نشان‌ها'}</button>

                    <h4>⭐ امتیاز و نظر</h4>

                        <span onclick="setDetailRating(1)">☆</span>
                        <span onclick="setDetailRating(2)">☆</span>

            window.detailGalleryPrev = function() {
                if (galleryItems.length === 0) return;
                galleryIndex = (galleryIndex - 1 + galleryItems.length) % galleryItems.length;
                const item = galleryItems[galleryIndex];
                const isVideo = ad.media_type === 'video' || (item && item.match(/\.(mp4|webm|mov)$/i));
                const gallery = document.querySelector('.ad-gallery');
                if (isVideo) {
                    gallery.innerHTML = `<video id="detailGalleryVideo" autoplay muted loop playsinline><source src="${item}" type="video/mp4"></video>`;

                    gallery.onclick = () => openMediaZoom(item, 'image');

                document.getElementById('detailGalleryIndex').textContent = galleryIndex + 1;

            window.detailGalleryNext = function() {
                if (galleryItems.length === 0) return;
                galleryIndex = (galleryIndex + 1) % galleryItems.length;
                const item = galleryItems[galleryIndex];
                const isVideo = ad.media_type === 'video' || (item && item.match(/\.(mp4|webm|mov)$/i));

                document.getElementById('detailGalleryIndex').textContent = galleryIndex + 1;

        function setDetailRating(val) {
            reviewRating = val;
            document.getElementById('detailReviewRating').value = val;
            document.querySelectorAll('#detailReviewStars span').forEach((el, idx) => {
                el.className = idx < val ? 'active' : '';

        async function submitDetailReview() {
            if (!requireVerifiedPhone()) return;
            const adId = document.getElementById('detailReviewAdId').value;
            const rating = parseInt(document.getElementById('detailReviewRating').value);
            const comment = document.getElementById('detailReviewComment').value.trim();
            if (!rating || rating < 1) { showToast('لطفاً امتیاز را انتخاب کنید', 'warning'); return; }
            try {
                const userId = getUserId();
                const data = await apiCall('/review', {
                    method: 'POST',
                    body: JSON.stringify({ adId: parseInt(adId), userId, rating, comment })
                });
                if (data.success) {
                    showToast('نظر شما ثبت شد', 'success');
                    loadDetailReviews(adId);
                    document.getElementById('detailReviewRating').value = 0;
                    document.getElementById('detailReviewComment').value = '';
                    document.querySelectorAll('#detailReviewStars span').forEach(el => { el.className = '';
                        el.textContent = '☆'; });
                    reviewRating = 0;
                    fetchAds(false);
                } else {
                    showToast(data.error || 'خطا در ثبت نظر', 'error');
                }
            } catch (err) { showToast('خطا در ثبت نظر', 'error'); }
        }

        function openMediaZoom(url, type) {

                container.innerHTML = `<video autoplay muted loop playsinline style="max-width:95%;max-height:95%;border-radius:8px;"><source src="${url}" type="video/mp4"></video>`;
            } else {
                container.innerHTML = `<img src="${url}" alt="نمایش" style="max-width:95%;max-height:95%;border-radius:8px;" />`;

        // ============================================================
        // ===== BANNER =====
        // ============================================================
        async function loadSplashBanner() {
            if (bannerShown) return;
            if (!isServiceEnabled('splash')) return;
            try {
                const data = await apiCall('/banner/splash');
                if (data.success && data.splash && data.splash.is_active) {
                    const banner = data.splash;
                    const isVideo = banner.media_type === 'video';
                    const mediaUrl = normalizeImageUrl(banner.image_id) || '';
                    const container = document.getElementById('bannerMediaContainer');
                    container.innerHTML = isVideo ?
                        `<video class="banner-image" autoplay muted loop playsinline><source src="${mediaUrl}" type="video/mp4"></video>` :
                        `<img class="banner-image" src="${mediaUrl}" alt="تبلیغ" />`;
                    document.getElementById('bannerTitle').textContent = banner.title || 'تبلیغ';
                    document.getElementById('bannerDesc').textContent = banner.description || '';
                    document.getElementById('bannerLink').href = banner.link || '#';
                    bannerTimer = banner.duration || 5;
                    document.getElementById('bannerTimer').textContent = bannerTimer;
                    document.getElementById('bannerOverlay').classList.add('show');
                    bannerShown = true;
                    if (bannerTimerInterval) clearInterval(bannerTimerInterval);
                    bannerTimerInterval = setInterval(() => {
                        bannerTimer--;
                        document.getElementById('bannerTimer').textContent = bannerTimer;
                        if (bannerTimer <= 0) { clearInterval(bannerTimerInterval);
                            bannerTimerInterval = null;
                            setTimeout(() => closeBanner(), 1000); }
                    }, 1000);
                }
            } catch (err) { console.error('Error loading splash banner:', err); }
        }

        function closeBanner() {
            document.getElementById('bannerOverlay').classList.remove('show');
            if (bannerTimerInterval) { clearInterval(bannerTimerInterval);
                bannerTimerInterval = null; }
        }

        async function loadInlineBanners() {
            const container = document.getElementById('bannerAdsContainer');
            if (!isServiceEnabled('banners')) {
                container.innerHTML = `<div class="service-disabled"><i class="fa-solid fa-ban"></i> بنرها غیرفعال هستند</div>`;

            try {
                const data = await apiCall('/banners');
                if (data.success && data.banners && data.banners.length > 0) {
                    container.innerHTML = '';
                    data.banners.forEach(banner => {
                        const isVideo = banner.media_type === 'video';
                        const mediaUrl = normalizeImageUrl(banner.image_id) || '';
                        const div = document.createElement('div');
                        div.className = 'banner-ad-container';
                        div.innerHTML = `
                            <div class="banner-ad-inner">

                                }

                container.innerHTML = `<div class="text-secondary">هیچ داده‌ای موجود نیست</div>`;

        }

        async function adminAddAdmin() {
            const userId = document.getElementById('newAdminId').value.trim();

        function adminAnnounce() {
            if (!checkAdminAccess()) return;
            const container = document.getElementById('adminResult');
            container.innerHTML = `
                <h4>اطلاعیه</h4>
                <div class="admin-row"><input type="text" id="announceTitle" placeholder="عنوان" style="flex:1;min-width:100px;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);font-size:13px;" /></div>
                <div class="admin-row"><textarea id="announceMessage" placeholder="متن پیام..." rows="3" style="width:100%;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);"></textarea></div>
                <div class="admin-row">
                    <select id="announceTarget" style="flex:1;min-width:100px;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);font-size:13px;">
                        <option value="all">همه</option>
                        <option value="admins">ادمین‌ها</option>
                        <option value="individual">فردی</option>
                    </select>
                    <input type="text" id="announceTargetId" placeholder="شناسه کاربر" style="display:none;flex:1;min-width:100px;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);font-size:13px;" />
                    <button onclick="adminSendAnnounce()" style="padding:8px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--ruby),var(--ruby-dark));color:#fff;border:none;cursor:pointer;">📤 ارسال</button>
                </div>
            `;
            document.getElementById('announceTarget').addEventListener('change', function() {
                document.getElementById('announceTargetId').style.display = this.value === 'individual' ? 'block' : 'none';
            });
        }

        async function adminSendAnnounce() {
            const title = document.getElementById('announceTitle').value.trim();
            const message = document.getElementById('announceMessage').value.trim();
            const target = document.getElementById('announceTarget').value;
            const targetId = document.getElementById('announceTargetId').value.trim();
            if (!title || !message) { showToast('عنوان و متن را وارد کنید', 'error'); return; }
            if (target === 'individual' && !targetId) { showToast('شناسه کاربر را وارد کنید', 'error'); return; }
            const adminId = getUserId();
            const data = await apiCall('/admin/announce', {
                method: 'POST',
                body: JSON.stringify({ title, message, target, targetId, adminId })
            });
            if (data.success) { showToast('اطلاعیه ارسال شد', 'success');
                document.getElementById('announceTitle').value = '';
                document.getElementById('announceMessage').value = ''; } else { showToast(data.error || 'خطا', 'error'); }
        }

            document.getElementById('filterModal').classList.remove('show');
            document.getElementById('filterBackdrop').classList.remove('show');

        function toggleSupportMenu(event) {
            event.stopPropagation();

            menu.classList.toggle('show');

            const menu = document.getElementById('supportDropdownMenu');

        // ============================================================
        // ===== THEME =====
        // ============================================================

            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('themeBtn').innerHTML = currentTheme === 'light' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';

        // ===== LANGUAGE =====

        function selectLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('jedar_lang', lang);

            document.getElementById('langOverlay').classList.add('hidden');

        function updateAllTexts() {
            // ... (همانند قبل)
            document.getElementById('navHomeLabel').textContent = 'خانه';
            document.getElementById('navAddLabel').textContent = 'ثبت';
            document.getElementById('navFavLabel').textContent = 'نشان‌ها';

        // ============================================================
        // ===== ADS FETCH =====
        // ============================================================
        async function fetchAds(showLoading = true) {
            if (isUpdating) return;
            isUpdating = true;
            const grid = document.getElementById('adsGrid');
            if (showLoading) grid.innerHTML = `<div class="loading-spinner"><i class="fa-solid fa-spinner"></i></div>`;
            try {
                const data = await apiCall('/ads');
                if (data.success && data.ads && data.ads.length > 0) {
                    allAds = data.ads.map(ad => {
                        if (ad.image_ids && typeof ad.image_ids === 'string') {
                            try { ad.image_ids = JSON.parse(ad.image_ids); } catch { ad.image_ids = []; }
                        } else if (!ad.image_ids) ad.image_ids = [];
                        if (ad.image_ids && Array.isArray(ad.image_ids)) {
                            ad.image_ids = ad.image_ids.map(img => normalizeImageUrl(img)).filter(url => url !== null);
                        } else ad.image_ids = [];
                        ad.media_type = ad.media_type || 'image';
                        return ad;
                    });
                    allAds.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
                    filteredAds = [...allAds];
                    renderAds(filteredAds);
                    renderCategories();
                    loadFavorites();
                } else {
                    grid.innerHTML = isServiceEnabled('ads') ?
                        `<div style="text-align:center;padding:40px 20px;color:var(--text-muted);">هیچ آگهی‌ای موجود نیست</div>` :
                        `<div class="service-disabled"><i class="fa-solid fa-ban"></i> ثبت آگهی غیرفعال است</div>`;
                }
            } catch (err) {
                grid.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-muted);">هیچ آگهی‌ای موجود نیست</div>`;
            }
            isUpdating = false;
        }

        function renderAds(ads) {
            const grid = document.getElementById('adsGrid');
            grid.innerHTML = '';
            if (!ads || ads.length === 0) {
                grid.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-muted);">هیچ آگهی‌ای موجود نیست</div>`;
                return;
            }
            ads.forEach(ad => {
                const card = document.createElement('div');
                card.className = 'ad-card';
                card.onclick = () => openAdDetail(ad.id);
                let mediaUrl = (ad.image_ids && ad.image_ids.length > 0) ? ad.image_ids[0] : '';
                const isVideo = ad.media_type === 'video' || (mediaUrl && mediaUrl.match(/\.(mp4|webm|mov)$/i));
                const isFav = favorites.includes(ad.id);
                const ratingAvg = ad.rating_avg ? Number(ad.rating_avg).toFixed(1) : '—';
                let mediaHtml = mediaUrl ?
                    (isVideo ? `<video muted playsinline><source src="${mediaUrl}" type="video/mp4"></video>` :
                        `<img src="${mediaUrl}" alt="${ad.title}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'no-image\\'><i class=\\'fa-solid fa-image\\'></i></div>'" onclick="event.stopPropagation();openMediaZoom('${mediaUrl}','image')" />`) :
                    `<div class="no-image"><i class="fa-solid fa-image"></i></div>`;
                const mediaBadge = isVideo ? `<div class="media-badge"><i class="fa-solid fa-video"></i></div>` : '';
                const specialBadge = ad.is_special ? `<span class="status-badge special">⭐ ویژه</span>` : '';
                card.innerHTML = `
                    <div class="ad-image" onclick="event.stopPropagation();${mediaUrl ? `openMediaZoom('${mediaUrl}','${isVideo ? 'video' : 'image'}')` : ''}">
                        ${mediaHtml}${mediaBadge}
                        <div class="favorite ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleFavorite(${ad.id})"><i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i></div>
                    </div>
                    <div class="ad-content">
                        <div class="title">${ad.title || 'بدون عنوان'}</div>
                        <div class="price">${(ad.price || 0).toLocaleString()} تومان</div>
                        <div class="meta">
                            <span class="location"><i class="fa-solid fa-location-dot"></i> ${ad.city || 'نامشخص'}</span>
                            <span class="time"><i class="fa-regular fa-clock"></i> ${formatTime(ad.created_at)}</span>
                            ${specialBadge}
                            <span><i class="fa-regular fa-star"></i> ${ratingAvg}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
                if (isVideo) {
                    const video = card.querySelector('video');
                    if (video) {
                        card.addEventListener('mouseenter', () => video.play());
                        card.addEventListener('mouseleave', () => video.pause());
                    }
                }
            });
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            const cats = ['all', 'pilgrimage', 'tourism', 'medical', 'beauty', 'services', 'jobs', 'real_estate', 'vehicles'];
            const catMap = {
                'all': 'همه',
                'pilgrimage': 'زیارت',
                'tourism': 'گردشگری',
                'medical': 'پزشکی',
                'beauty': 'زیبایی',
                'services': 'خدمات',
                'jobs': 'کاریابی',
                'real_estate': 'املاک',
                'vehicles': 'خودرو'
            };
            container.innerHTML = '';
            cats.forEach((cat, i) => {
                const chip = document.createElement('span');
                chip.className = 'category-chip' + (i === 0 ? ' active' : '');
                chip.textContent = catMap[cat] || cat;
                chip.onclick = () => filterAds(cat);
                container.appendChild(chip);
            });
        }

        function filterAds(cat) {
            document.querySelectorAll('.category-chip').forEach(el => el.classList.remove('active'));
            const chips = document.querySelectorAll('.category-chip');
            const cats = ['all', 'pilgrimage', 'tourism', 'medical', 'beauty', 'services', 'jobs', 'real_estate', 'vehicles'];
            const idx = cats.indexOf(cat);
            if (chips[idx]) chips[idx].classList.add('active');
            filteredAds = cat === 'all' ? [...allAds] : allAds.filter(ad => ad.category === cat || ad.category?.includes(cat));
            renderAds(filteredAds);
        }

        function searchAds() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            filteredAds = query ? allAds.filter(ad =>
                (ad.title && ad.title.toLowerCase().includes(query)) ||
                (ad.description && ad.description.toLowerCase().includes(query)) ||
                (ad.city && ad.city.toLowerCase().includes(query))
            ) : [...allAds];
            renderAds(filteredAds);
        }

        function applyAdvancedFilters() {
            const category = document.getElementById('filterCategory').value;
            const priceRange = document.getElementById('filterPrice').value;
            const city = document.getElementById('filterCity').value;
            const status = document.getElementById('filterStatus').value;
            let results = [...allAds];
            if (category !== 'all') results = results.filter(a => a.category === category);
            if (city !== 'all') results = results.filter(a => a.city === city);
            if (status !== 'all') results = results.filter(a => a.status === status);
            if (priceRange !== 'all') {
                const [min, max] = priceRange.split('-');
                if (max && max !== '+') results = results.filter(a => a.price >= parseInt(min) && a.price <= parseInt(max));
                else if (priceRange.endsWith('+')) { const minVal = parseInt(priceRange.replace('+', ''));
                    results = results.filter(a => a.price >= minVal); }
            }
            filteredAds = results;
            renderAds(filteredAds);
            closeFilter();
            showToast(`${filteredAds.length} آگهی یافت شد`, 'success');
        }

        function clearFilters() {
            document.getElementById('filterCategory').value = 'all';
            document.getElementById('filterPrice').value = 'all';
            document.getElementById('filterCity').value = 'all';
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('searchInput').value = '';
            filteredAds = [...allAds];
            renderAds(filteredAds);
            closeFilter();
            showToast('فیلترها پاک شدند', 'info');
        }

        function refreshAll() {
            showLoading(true);
            loadToggleStatuses().then(() => {
                fetchAds(true);
                if (currentTab === 'profile') fetchMyAds();
                if (currentTab === 'favorites') fetchFavorites();
                if (currentTab === 'rules') loadRules();
                if (currentTab === 'support') loadSupport();
                checkAdminStatus();
                loadInlineBanners();
                loadSplashBanner();
                showLoading(false);
                showToast('✅ بروزرسانی شد', 'success');
            });
        }

        // ============================================================
        // ===== INIT =====
        // ============================================================
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('themeBtn').innerHTML = currentTheme === 'light' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';

        if (!localStorage.getItem('jedar_lang_overlay')) {
            document.getElementById('langOverlay').classList.remove('hidden');
        } else {
            document.getElementById('langOverlay').classList.add('hidden');
        }

        updateAllTexts();

        showLoading(true);
        loadToggleStatuses().then(() => {
            fetchAds(true);
            loadProfile();
            loadInlineBanners();
            setTimeout(() => {
                loadSplashBanner();
                showLoading(false);
            }, 800);
        });

        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') searchAds();
        });

        console.log(`🚀 جـدار بازار - نسخه نهایی با نشست یکتا و بازیابی`);
        console.log(`👤 Guest ID: ${guestId}`);
        console.log(`📡 API Base: ${API_BASE}`);
        console.log('✅ تأیید شماره برای ثبت آگهی و نظر الزامی است.');
        console.log('✈️ تلگرام و 📧 ایمیل - هر دو فعال هستند');
        console.log('🔐 بازیابی بر اساس روش تأیید اولیه');
    </script>
