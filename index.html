<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>جـدار بازار | J-DAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --ruby: #e74c3c;
            --ruby-dark: #c0392b;
            --ruby-light: #fde8e8;
            --ruby-glow: rgba(231, 76, 60, 0.25);
            --gold: #f39c12;
            --gold-light: #fef3c7;
            --gold-glow: rgba(243, 156, 18, 0.25);
            --green: #27ae60;
            --green-glow: rgba(39, 174, 96, 0.25);
            --blue: #3498db;
            --blue-glow: rgba(52, 152, 219, 0.25);
            --purple: #8e44ad;
            --purple-glow: rgba(142, 68, 173, 0.25);
            --bg-primary: #f0f2f8;
            --bg-card: #ffffff;
            --bg-input: #f5f7fc;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aaa;
            --border-color: #e8ecf5;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 40px 80px rgba(0, 0, 0, 0.16);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 9999px;
            --font: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            --transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        [data-theme="dark"] {
            --bg-primary: #0a0a18;
            --bg-card: #14142a;
            --bg-input: #1e1e3a;
            --bg-glass: rgba(20, 20, 42, 0.8);
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c8;
            --text-muted: #6a6a8a;
            --border-color: #2a2a4a;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 40px 80px rgba(0, 0, 0, 0.6);
        }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            direction: rtl;
            padding-bottom: 80px;
            overflow-x: hidden;
            transition: background 0.4s, color 0.4s;
            background-image: radial-gradient(ellipse at 20% 50%, var(--ruby-glow) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, var(--gold-glow) 0%, transparent 50%);
        }
        [data-theme="dark"] body {
            background-image: radial-gradient(ellipse at 20% 50%, rgba(231, 76, 60, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(243, 156, 18, 0.06) 0%, transparent 50%);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--ruby), var(--gold));
            border-radius: 10px;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--ruby), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .header-actions button {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        .header-actions button:hover {
            background: var(--ruby-light);
            border-color: var(--ruby);
            color: var(--ruby);
            transform: translateY(-3px) scale(1.05);
        }
        .lang-btn {
            width: auto !important;
            padding: 0 14px;
            gap: 6px;
            font-weight: 600;
        }

        /* ===== Auth Modal ===== */
        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-modal.show {
            display: flex;
        }
        .auth-box {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            max-width: 420px;
            width: 100%;
            padding: 40px 28px 36px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .auth-box h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .auth-box .field {
            margin-bottom: 16px;
        }
        .auth-box .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .auth-box .field input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font);
            transition: all var(--transition);
        }
        .auth-box .field input:focus {
            border-color: var(--ruby);
            box-shadow: 0 0 0 4px var(--ruby-glow);
            outline: none;
        }
        .auth-box .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--ruby), var(--ruby-dark));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 20px var(--ruby-glow);
        }
        .auth-box .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px var(--ruby-glow);
        }
        .auth-box .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .auth-box .error {
            color: var(--ruby);
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }
        .auth-box .success {
            color: var(--green);
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }
        .auth-box .note {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 12px;
        }
        .auth-box .note a {
            color: var(--ruby);
            font-weight: 600;
            cursor: pointer;
        }
        .auth-box .close-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .auth-box {
            position: relative;
        }

        /* ===== Main App ===== */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px 14px 80px;
        }

        /* ===== Search & Filters ===== */
        .search-box {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 4px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
        }
        .search-box:focus-within {
            border-color: var(--ruby);
            box-shadow: 0 0 0 6px var(--ruby-glow), var(--shadow-md);
            transform: translateY(-2px);
        }
        .search-box i {
            color: var(--text-muted);
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 0;
            font-size: 15px;
            color: var(--text-primary);
            font-family: var(--font);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box .search-btn {
            background: linear-gradient(135deg, var(--ruby), var(--ruby-dark));
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            padding: 8px 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .search-box .search-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 4px 20px var(--ruby-glow);
        }

        .filter-toggle {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 10px 20px;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
        }
        .filter-toggle:hover {
            border-color: var(--ruby);
            background: var(--ruby-light);
            color: var(--ruby);
            transform: translateY(-3px);
        }
        .filter-toggle i {
            color: var(--ruby);
        }
        .filter-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            margin-bottom: 12px;
            display: none;
            box-shadow: var(--shadow-sm);
        }
        .filter-panel.show {
            display: block;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .filter-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
        }
        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .filter-actions button {
            flex: 1;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
        }
        .filter-actions .apply {
            background: linear-gradient(135deg, var(--ruby), var(--ruby-dark));
            color: #fff;
        }
        .filter-actions .clear {
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
        }
        .filter-actions .apply:hover,
        .filter-actions .clear:hover {
            transform: translateY(-3px);
        }

        /* ===== Categories ===== */
        .categories {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 6px 0 12px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .category-chip {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 6px 20px;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-primary);
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        .category-chip:hover {
            border-color: var(--ruby);
            background: var(--ruby-light);
            transform: translateY(-4px);
        }
        .category-chip.active {
            background: linear-gradient(135deg, var(--ruby), var(--ruby-dark));
            color: #fff;
            border-color: var(--ruby);
            box-shadow: 0 4px 20px var(--ruby-glow);
        }

        /* ===== Ads Grid ===== */
        .ads-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 6px;
        }
        .ad-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            gap: 14px;
            align-items: flex-start;
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .ad-card:hover {
            border-color: var(--ruby);
            transform: translateX(-6px) scale(1.01);
            box-shadow: var(--shadow-lg);
        }
        .ad-card .img {
            width: 80px;
            height: 80px;
            min-width: 80px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-input);
            flex-shrink: 0;
            position: relative;
        }
        .ad-card .img img,
        .ad-card .img video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ad-card .img .no-img {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--text-muted);
            font-size: 12px;
            background: var(--bg-input);
        }
        .ad-card .info {
            flex: 1;
            min-width: 0;
        }
        .ad-card .info .title {
            font-weight: 700;
            font-size: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .ad-card .info .price {
            font-weight: 800;
            font-size: 18px;
            color: var(--ruby);
            margin-top: 2px;
        }
        .ad-card .info .meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .ad-card .info .meta i {
            margin-left: 3px;
        }

        /* ===== Bottom Nav ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 14px;
            z-index: 100;
            border-top-left-radius: var(--radius-xl);
            border-top-right-radius: var(--radius-xl);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.06);
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition);
            font-size: 8px;
            background: none;
            border: none;
            font-family: var(--font);
            padding: 0 6px;
            min-width: 48px;
        }
        .bottom-nav .nav-item:hover {
            color: var(--ruby);
        }
        .bottom-nav .nav-item.active {
            color: var(--ruby);
        }
        .bottom-nav .nav-item i {
            font-size: 22px;
            margin-bottom: 2px;
            transition: all var(--transition);
        }
        .bottom-nav .nav-item.active i {
            transform: translateY(-4px) scale(1.1);
        }
        .bottom-nav .nav-item .label {
            font-size: 9px;
            font-weight: 600;
        }

        /* ===== Tab Content ===== */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Profile ===== */
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }
        .profile-card .field {
            margin-bottom: 14px;
        }
        .profile-card .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .profile-card .field input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
        }
        .profile-card .field input:focus {
            border-color: var(--ruby);
            box-shadow: 0 0 0 4px var(--ruby-glow);
            outline: none;
        }
        .profile-card .btn-save {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--ruby), var(--ruby-dark));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .profile-card .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px var(--ruby-glow);
        }
        .profile-card .logout {
            margin-top: 10px;
            background: var(--ruby);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all var(--transition);
        }
        .profile-card .logout:hover {
            transform: translateY(-3px);
        }
        .verify-status {
            padding: 10px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 600;
            margin: 8px 0;
        }
        .verify-status.success {
            background: #e8f5e9;
            color: var(--green);
        }
        .verify-status.warning {
            background: #fef3c7;
            color: var(--gold);
        }

        /* ===== My Ads ===== */
        .my-ad-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition);
        }
        .my-ad-item:hover {
            border-color: var(--ruby);
            transform: translateX(-4px);
            box-shadow: var(--shadow-md);
        }
        .my-ad-item .info .title {
            font-weight: 600;
            font-size: 15px;
        }
        .my-ad-item .info .sub {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .my-ad-item .info .sub .status {
            font-size: 10px;
            padding: 2px 14px;
            border-radius: var(--radius-full);
            font-weight: 600;
        }
        .my-ad-item .info .sub .status.pending {
            background: rgba(243, 156, 18, 0.15);
            color: var(--gold);
        }
        .my-ad-item .info .sub .status.approved {
            background: rgba(39, 174, 96, 0.12);
            color: var(--green);
        }
        .my-ad-item .info .sub .status.rejected {
            background: rgba(231, 76, 60, 0.12);
            color: var(--ruby);
        }
        .my-ad-item .actions button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
        }
        .my-ad-item .actions .delete {
            color: var(--ruby);
        }
        .my-ad-item .actions .delete:hover {
            background: rgba(231, 76, 60, 0.1);
            transform: scale(1.15);
        }

        /* ===== Add Ad Modal ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            max-width: 500px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 28px 24px 32px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
            position: relative;
            animation: slideUp 0.3s ease;
        }
        .modal-box .close-modal {
            position: absolute;
            top: 12px;
            left: 12px;
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .modal-box .close-modal:hover {
            color: var(--ruby);
            transform: rotate(90deg);
        }
        .modal-box h2 {
            margin-bottom: 16px;
            font-size: 22px;
        }

            background: var(--bg-input);
            color: var(--text-primary);

            font-family: var(--font);

        .modal-box .field textarea:focus,

            transition: all var(--transition);
            background: var(--bg-input);

            border-color: var(--ruby);
            background: var(--ruby-light);

            font-size: 32px;
            color: var(--ruby);
            display: block;
            margin-bottom: 4px;

            font-size: 13px;
            color: var(--text-secondary);
        }
        .modal-box .file-upload input {
            display: none;
        }
        .modal-box .preview-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .modal-box .preview-grid .item {
            aspect-ratio: 1/1;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .modal-box .preview-grid .item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-box .preview-grid .item .remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--ruby), var(--ruby-dark));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);

        }
        .modal-box .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .modal-box .error-msg {
            color: var(--ruby);
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0;

        .admin-grid button {
            padding: 12px 10px;

            font-weight: 700;
            font-size: 13px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            transition: all var(--transition);
            cursor: pointer;
            font-family: var(--font);
            display: flex;
            align-items: center;

        }

        }
        .mb-10 {
            margin-bottom: 10px;
        }
        .loading {
            text-align: center;
            padding: 30px 0;
            color: var(--ruby);
        }
        .loading i {
            font-size: 32px;

        }
        @keyframes spin {
            0% {

        }
        .empty {

            }

                padding: 30px 20px 28px;
            }

            if (!phone || phone.length < 10) {
                showError('authError', 'شماره معتبر وارد کنید.');
                return;
            }
            document.getElementById('sendCodeBtn').disabled = true;
            document.getElementById('sendCodeBtn').textContent = '⏳ در حال ارسال...';
            try {
                const res = await fetch(`${API_BASE}/auth/send-2fa-telegram`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('authSuccess').textContent = '✅ کد ارسال شد.';
                    document.getElementById('authSuccess').style.display = 'block';
                    document.getElementById('authStep1').style.display = 'none';
                    document.getElementById('authStep2').style.display = 'block';
                } else {
                    showError('authError', data.error || 'خطا در ارسال کد.');

                showError('authError', 'خطا در ارتباط با سرور.');

            document.getElementById('sendCodeBtn').textContent = t('sendCode');

        async function verifyCode() {
            const phone = document.getElementById('phoneInput').value.trim();
            const code = document.getElementById('codeInput').value.trim();
            if (!code || code.length !== 6) {
                showError('verifyError', 'کد ۶ رقمی را وارد کنید.');
                return;
            }
            document.getElementById('verifyBtn').disabled = true;
            document.getElementById('verifyBtn').textContent = '⏳ ...';
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, code })
                });
                const data = await res.json();
                if (data.success) {
                    sessionId = data.sessionId;
                    userId = data.userId;
                    localStorage.setItem('jedar_session_id', sessionId);
                    localStorage.setItem('jedar_user_id', userId);
                    isAdmin = data.isAdmin || false;
                    closeAuth();
                    await loadProfile();
                    await fetchAds();
                    checkAdmin();
                    showToast('✅ ورود موفق');
                } else {
                    showError('verifyError', data.error || 'کد نامعتبر.');
                }
            } catch (e) {
                showError('verifyError', 'خطا در ارتباط با سرور.');
            }
            document.getElementById('verifyBtn').disabled = false;
            document.getElementById('verifyBtn').textContent = t('verify');
        }

        // ============================================================

        async function apiCall(endpoint, options = {}) {
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (sessionId) headers['X-Session-Id'] = sessionId;
            const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
            return await res.json();
        }

        function renderAds() {
            const grid = document.getElementById('adsGrid');
            if (!filteredAds.length) {
                grid.innerHTML = `<div class="empty"><i class="fa-regular fa-newspaper"></i><p>${t('noAds')}</p></div>`;
                return;
            }
            let html = '';
            filteredAds.forEach(ad => {
                const img = ad.image_ids && ad.image_ids.length ? `${IMAGE_BASE}${ad.image_ids[0]}` : '';
                const isVideo = ad.media_type === 'video';
                const statusEmoji = ad.status === 'approved' ? '✅' : ad.status === 'pending' ? '⏳' : '❌';
                html += `
                    <div class="ad-card" onclick="viewAd(${ad.id})">
                        <div class="img">
                            ${img ? (isVideo ? `<video src="${img}" muted></video>` : `<img src="${img}" />`) : `<div class="no-img"><i class="fa-regular fa-image"></i></div>`}
                        </div>
                        <div class="info">
                            <div class="title">${ad.title}</div>
                            <div class="price">${(ad.price || 0).toLocaleString()} تومان</div>
                            <div class="meta">
                                <span><i class="fa-regular fa-location-dot"></i> ${ad.city || 'نامشخص'}</span>
                                <span><i class="fa-regular fa-clock"></i> ${timeAgo(ad.created_at)}</span>
                                ${ad.is_special ? '<span style="color:var(--gold);">⭐ ویژه</span>' : ''}
                                ${ad.status !== 'approved' ? `<span style="color:var(--ruby);">${statusEmoji}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function timeAgo(ts) {
            if (!ts) return '';
            const diff = Math.floor(Date.now() / 1000) - ts;
            if (diff < 60) return 'لحظاتی پیش';
            if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه پیش';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت پیش';
            if (diff < 604800) return Math.floor(diff / 86400) + ' روز پیش';
            return Math.floor(diff / 604800) + ' هفته پیش';
        }

        function renderCategories() {
            const cats = ['all', 'pilgrimage', 'tourism', 'medical', 'beauty', 'services', 'jobs', 'real_estate', 'vehicles'];
            const labels = {
                all: t('all'),
                pilgrimage: 'زیارت',
                tourism: 'گردشگری',
                medical: 'پزشکی',
                beauty: 'زیبایی',
                services: 'خدمات',
                jobs: 'کاریابی',
                real_estate: 'املاک',
                vehicles: 'خودرو'
            };
            let html = cats.map(c => `<span class="category-chip ${c === 'all' ? 'active' : ''}" data-cat="${c}" onclick="filterByCategory('${c}')">${labels[c]}</span>`).join('');
            document.getElementById('categoriesContainer').innerHTML = html;
        }

        function filterByCategory(cat) {
            document.querySelectorAll('.category-chip').forEach(el => el.classList.remove('active'));
            document.querySelector(`.category-chip[data-cat="${cat}"]`)?.classList.add('active');
            if (cat === 'all') {
                filteredAds = [...allAds];
            } else {
                filteredAds = allAds.filter(ad => ad.category === cat);
            }
            renderAds();
        }

        function searchAds() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!q) {
                filteredAds = [...allAds];
            } else {
                filteredAds = allAds.filter(ad =>
                    (ad.title && ad.title.toLowerCase().includes(q)) ||
                    (ad.description && ad.description.toLowerCase().includes(q)) ||
                    (ad.city && ad.city.toLowerCase().includes(q))
                );
            }
            renderAds();
        }

        function toggleFilter() {
            const panel = document.getElementById('filterPanel');
            const arrow = document.getElementById('filterArrow');
            panel.classList.toggle('show');
            arrow.className = panel.classList.contains('show') ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down';
        }

        function applyFilters() {
            const cat = document.getElementById('filterCategory').value;
            const price = document.getElementById('filterPrice').value;
            const city = document.getElementById('filterCity').value;
            const status = document.getElementById('filterStatus').value;
            let results = [...allAds];
            if (cat !== 'all') results = results.filter(a => a.category === cat);
            if (city !== 'all') results = results.filter(a => a.city === city);
            if (status !== 'all') results = results.filter(a => a.status === status);
            if (price !== 'all') {
                const [min, max] = price.split('-');
                if (max && max !== '+') results = results.filter(a => a.price >= parseInt(min) && a.price <= parseInt(max));
                else if (price.endsWith('+')) results = results.filter(a => a.price >= parseInt(price.replace('+', '')));
            }
            filteredAds = results;
            renderAds();
            toggleFilter();
        }

        function clearFilters() {
            document.getElementById('filterCategory').value = 'all';
            document.getElementById('filterPrice').value = 'all';
            document.getElementById('filterCity').value = 'all';
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('searchInput').value = '';
            filteredAds = [...allAds];
            renderAds();
            toggleFilter();
        }

        document.getElementById('adImagesInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length > 4) {
                alert('حداکثر ۴ فایل مجاز است.');
                this.value = '';
                return;
            }
            const grid = document.getElementById('adPreviewGrid');
            grid.innerHTML = '';
            files.forEach((file, idx) => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const item = document.createElement('div');
                    item.className = 'item';
                    const isVideo = file.type.startsWith('video/');
                    item.innerHTML = isVideo ?
                        `<video src="${ev.target.result}" muted></video>` :
                        `<img src="${ev.target.result}" />`;
                    const remove = document.createElement('button');
                    remove.className = 'remove';
                    remove.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                    remove.onclick = function(e) {
                        e.stopPropagation();
                        const dt = new DataTransfer();
                        const remaining = Array.from(document.getElementById('adImagesInput').files);
                        remaining.splice(idx, 1);
                        remaining.forEach(f => dt.items.add(f));
                        document.getElementById('adImagesInput').files = dt.files;
                        item.remove();
                        uploadedFiles = uploadedFiles.filter((_, i) => i !== idx);
                    };
                    item.appendChild(remove);
                    grid.appendChild(item);
                };
                reader.readAsDataURL(file);
            });
            uploadedFiles = files;
        });

        async function submitAd() {
            const title = document.getElementById('adTitle').value.trim();
            const category = document.getElementById('adCategory').value;
            const price = document.getElementById('adPrice').value.trim();
            const desc = document.getElementById('adDescription').value.trim();
            const city = document.getElementById('adCity').value.trim();
            const phone = document.getElementById('adPhone').value.trim();

            if (!title || !price || !desc || !city || !phone) {
                document.getElementById('addAdError').textContent = 'لطفاً تمام فیلدهای اجباری را پر کنید.';
                document.getElementById('addAdError').style.display = 'block';
                return;
            }

            const files = document.getElementById('adImagesInput').files;
            if (files.length === 0) {
                document.getElementById('addAdError').textContent = 'حداقل یک تصویر انتخاب کنید.';
                document.getElementById('addAdError').style.display = 'block';
                return;
            }

            document.getElementById('submitAdBtn').disabled = true;
            document.getElementById('submitAdBtn').textContent = '⏳ در حال ارسال...';

            // Upload images
            const imageIds = [];
            for (const file of files) {
                const formData = new FormData();
                formData.append('photo', file);
                try {
                    const res = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        imageIds.push(data.file_id);
                    } else {
                        throw new Error('Upload failed');
                    }
                } catch (e) {
                    alert('خطا در آپلود تصویر.');
                    document.getElementById('submitAdBtn').disabled = false;
                    document.getElementById('submitAdBtn').textContent = t('submit');
                    return;
                }
            }

            // Submit ad
            try {
                const data = await apiCall('/ad/submit', {
                    method: 'POST',
                    body: JSON.stringify({
                        title,
                        category,
                        price: parseInt(price),
                        description: desc,
                        city,
                        phone,
                        image_ids: imageIds
                    })
                });
                if (data.success) {
                    showToast('✅ آگهی ثبت شد و در انتظار تایید است.');
                    closeAddAd();
                    fetchAds();
                    fetchMyAds();
                } else {
                    alert(data.error || 'خطا در ثبت آگهی.');
                }
            } catch (e) {
                alert('خطا در ارتباط با سرور.');
            }
            document.getElementById('submitAdBtn').disabled = false;
            document.getElementById('submitAdBtn').textContent = t('submit');
        }

            if (!confirm('تایید آگهی؟')) return;
            try {
                const data = await apiCall('/admin/approve', { method: 'POST', body: JSON.stringify({ adId: id }) });
                if (data.success) {
                    showToast(t('adApproved'));
                    adminPending();
                    fetchAds();
                } else {
                    alert(t('error'));
                }
            } catch (e) { alert(t('error')); }
        }

        async function adminReject(id) {
            if (!confirm('رد آگهی؟')) return;
            try {
                const data = await apiCall('/admin/reject', { method: 'POST', body: JSON.stringify({ adId: id }) });
                if (data.success) {
                    showToast(t('adRejected'));
                    adminPending();
                    fetchAds();
                } else {
                    alert(t('error'));
                }
            } catch (e) { alert(t('error')); }
        }

        async function adminAllAds() {
            const res = document.getElementById('adminResult');
            res.innerHTML = `<div class="loading"><i class="fa-solid fa-spinner"></i></div>`;
            try {
                const data = await apiCall('/admin/all-ads');
                if (data.success) {
                    const ads = data.ads || [];
                    if (!ads.length) {
                        res.innerHTML = 'هیچ آگهی وجود ندارد.';
                        return;
                    }
                    let html = '';
                    ads.slice(0, 20).forEach(ad => {
                        html += `
                            <div style="border-bottom:1px solid var(--border-color);padding:8px 0;display:flex;justify-content:space-between;">
                                <span>${ad.status === 'approved' ? '✅' : ad.status === 'pending' ? '⏳' : '❌'} ${ad.title} (💰${ad.price})</span>
                                <button onclick="viewAd(${ad.id})" style="background:var(--blue);color:#fff;border:none;padding:2px 8px;border-radius:4px;cursor:pointer;">👁</button>
                            </div>
                        `;
                    });
                    res.innerHTML = html;
                } else {
                    res.innerHTML = t('error');
                }
            } catch (e) { res.innerHTML = t('error'); }
        }

        async function adminUsers() {
            const res = document.getElementById('adminResult');
            res.innerHTML = `<div class="loading"><i class="fa-solid fa-spinner"></i></div>`;
            try {
                const data = await apiCall('/admin/users');
                if (data.success) {
                    const users = data.users || [];
                    if (!users.length) {
                        res.innerHTML = 'هیچ کاربری ثبت نشده است.';
                        return;
                    }
                    let html = '';
                    users.slice(0, 20).forEach(u => {
                        html += `
                            <div style="border-bottom:1px solid var(--border-color);padding:6px 0;">
                                🆔 ${u.id} | 👤 ${u.fullname || u.first_name || 'نامشخص'} | 📱 ${u.phone || 'ندارد'} | ${u.is_blocked ? '🚫' : '🟢'}
                            </div>
                        `;
                    });
                    res.innerHTML = html;
                } else {
                    res.innerHTML = t('error');
                }
            } catch (e) { res.innerHTML = t('error'); }
        }

        async function adminStats() {
            const res = document.getElementById('adminResult');
            res.innerHTML = `<div class="loading"><i class="fa-solid fa-spinner"></i></div>`;
            try {
                const data = await apiCall('/admin/stats');
                if (data.success) {
                    const s = data.stats;
                    res.innerHTML = `
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                            <div style="background:var(--bg-input);padding:12px;border-radius:8px;text-align:center;">
                                <div>👥 ${t('users')}</div>
                                <div style="font-size:22px;font-weight:800;color:var(--ruby);">${s.totalUsers || 0}</div>
                            </div>
                            <div style="background:var(--bg-input);padding:12px;border-radius:8px;text-align:center;">
                                <div>📌 ${t('allAds')}</div>
                                <div style="font-size:22px;font-weight:800;color:var(--ruby);">${s.totalAds || 0}</div>
                            </div>
                            <div style="background:var(--bg-input);padding:12px;border-radius:8px;text-align:center;">
                                <div>⏳ ${t('pending')}</div>
                                <div style="font-size:22px;font-weight:800;color:var(--gold);">${s.pendingAds || 0}</div>
                            </div>
                            <div style="background:var(--bg-input);padding:12px;border-radius:8px;text-align:center;">
                                <div>⭐ ویژه</div>
                                <div style="font-size:22px;font-weight:800;color:var(--gold);">${s.specialAds || 0}</div>
                            </div>
                        </div>
                    `;
                } else {
                    res.innerHTML = t('error');
                }
            } catch (e) { res.innerHTML = t('error'); }
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            const btn = document.querySelector(`.bottom-nav .nav-item[data-tab="${tab}"]`);
            if (btn) btn.classList.add('active');
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            if (tab === 'home') {
                document.getElementById('tabHome').classList.add('active');
                // Home is the ads grid itself
                document.getElementById('adsGrid').style.display = 'flex';
                document.querySelector('.search-box').style.display = 'flex';
                document.querySelector('.filter-toggle').style.display = 'flex';
                document.querySelector('.categories').style.display = 'flex';
                document.querySelector('#adsGrid').style.display = 'flex';
            } else {
                document.getElementById('adsGrid').style.display = 'none';
                document.querySelector('.search-box').style.display = 'none';
                document.querySelector('.filter-toggle').style.display = 'none';
                document.querySelector('.categories').style.display = 'none';
                if (tab === 'myads') {
                    document.getElementById('tabMyAds').classList.add('active');
                    fetchMyAds();
                } else if (tab === 'profile') {
                    document.getElementById('tabProfile').classList.add('active');
                    loadProfile();
                } else if (tab === 'admin') {
                    document.getElementById('tabAdmin').classList.add('active');
                    renderAdmin();
                }
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            // Theme
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('themeIcon').className = currentTheme === 'light' ? 'fa-solid fa-moon' :
                'fa-solid fa-sun';

            // Language
            updateUI();

            // Check session
            if (sessionId) {
                // Validate session
                apiCall('/auth/verify-session').then(data => {
                    if (!data.success) {
                        localStorage.removeItem('jedar_session_id');
                        localStorage.removeItem('jedar_user_id');
                        sessionId = '';
                        userId = '';
                    } else {
                        userId = data.userId;
                        isAdmin = data.isAdmin || false;
                        if (isAdmin) document.getElementById('navAdmin').style.display = 'flex';
                        loadProfile();
                    }
                });
            }

            // Show auth if not logged in
            if (!sessionId) {
                // openAuth();
            }

            // Load ads
            fetchAds();

            // Default tab
            switchTab('home');

            // Check admin periodically
            setInterval(checkAdmin, 60000);
        }

        function refresh() {
            fetchAds();
            if (currentTab === 'myads') fetchMyAds();
            if (currentTab === 'profile') loadProfile();
            if (currentTab === 'admin') renderAdmin();
            showToast('🔄 بروزرسانی');
        }

        // ============================================================
        // START
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
    </html>
