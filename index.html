<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>جـدار | J-DAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* === استایل‌های ساده و کارآمد === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f0f0f3;
            --card: #fff;
            --text: #111;
            --text2: #555;
            --primary: #7b5aff;
            --danger: #ff5e7c;
            --success: #4caf50;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: var(--card);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 24px;
        }
        .logo i {
            font-size: 30px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e8;
            border-radius: 12px;
            font-size: 15px;
            background: #f9f9fc;
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(123, 90, 255, 0.15);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        .switch-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text2);
        }
        .switch-link a {
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }
        .error-msg {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin: 8px 0;
            display: none;
            padding: 8px;
            background: rgba(255, 94, 124, 0.08);
            border-radius: 8px;
        }
        .success-msg {
            color: var(--success);
            font-size: 13px;
            text-align: center;
            margin: 8px 0;
            display: none;
            padding: 8px;
            background: rgba(76, 175, 80, 0.08);
            border-radius: 8px;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            background: #333;
            color: #fff;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: var(--success);
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.warning {
            background: #ff9800;
        }
        .test-info {
            background: #f0f0f8;
            border-radius: 12px;
            padding: 12px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text2);
            border: 1px dashed #ccc;
        }
        .test-info code {
            background: #e0e0e8;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .test-info .status {
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }
        .test-info .status.online {
            background: #4caf50;
            color: #fff;
        }
        .test-info .status.offline {
            background: #ff5e7c;
            color: #fff;
        }
        .test-info .status.unknown {
            background: #ff9800;
            color: #fff;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="container" id="authContainer">
        <div class="logo"><i class="fa-solid fa-layer-group"></i> جـدار</div>

        <!-- ===== STATUS TEST ===== -->
        <div class="test-info" id="statusTest">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
                <span>📡 وضعیت اتصال به Worker:</span>
                <span class="status unknown" id="workerStatus">در حال بررسی...</span>
            </div>
            <div style="margin-top:6px; font-size:12px; color:#888;">
                API: <code id="apiUrlDisplay">https://souq-bot.mehdi11eidani.workers.dev/api/feed</code>
            </div>
            <div id="testResult" style="margin-top:4px; font-size:12px; color:#666;"></div>
        </div>

        <!-- ===== LOGIN ===== -->
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div id="loginError" class="error-msg"></div>
            <div id="loginSuccess" class="success-msg"></div>
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" id="loginUsername" placeholder="نام کاربری" required autocomplete="username" />
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="loginPassword" placeholder="رمز عبور" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">ورود</button>
        </form>

        <!-- ===== REGISTER ===== -->
        <form id="registerForm" onsubmit="return handleRegister(event)" style="display:none;">
            <div id="registerError" class="error-msg"></div>
            <div id="registerSuccess" class="success-msg"></div>
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" id="registerUsername" placeholder="نام کاربری" required autocomplete="username" />
            </div>
            <div class="form-group">
                <label>نام و نام خانوادگی</label>
                <input type="text" id="registerFullname" placeholder="نام کامل" required />
            </div>
            <div class="form-group">
                <label>شماره تماس</label>
                <input type="tel" id="registerPhone" placeholder="0912..." />
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="registerPassword" placeholder="حداقل ۶ کاراکتر" required minlength="6" autocomplete="new-password" />
            </div>
            <div class="form-group">
                <label>تکرار رمز عبور</label>
                <input type="password" id="registerConfirm" placeholder="تکرار رمز" required autocomplete="new-password" />
            </div>
            <button type="submit" class="btn btn-primary" id="registerBtn">ثبت‌نام</button>
        </form>

        <!-- ===== SWITCH ===== -->
        <div class="switch-link">
            <span id="switchText">حساب کاربری ندارید؟</span>
            <a id="switchLink">ثبت‌نام کنید</a>
        </div>

        <!-- ===== RESPONSE LOG ===== -->
        <div id="responseLog" style="margin-top:16px; padding:10px; background:#f5f5f8; border-radius:12px; font-size:12px; color:#888; max-height:150px; overflow-y:auto; display:none; border:1px solid #eee;">
            <div style="font-weight:600; margin-bottom:4px;">📋 لاگ پاسخ‌ها:</div>
            <div id="logContent"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const API_BASE = 'https://souq-bot.mehdi11eidani.workers.dev';
        const API_VERSION = 'v2';

        // ============================================================
        // DOM REFS
        // ============================================================
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const switchText = document.getElementById('switchText');
        const switchLink = document.getElementById('switchLink');
        const loginError = document.getElementById('loginError');
        const loginSuccess = document.getElementById('loginSuccess');
        const registerError = document.getElementById('registerError');
        const registerSuccess = document.getElementById('registerSuccess');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const toast = document.getElementById('toast');
        const workerStatus = document.getElementById('workerStatus');
        const testResult = document.getElementById('testResult');
        const apiUrlDisplay = document.getElementById('apiUrlDisplay');
        const logContent = document.getElementById('logContent');
        const responseLog = document.getElementById('responseLog');

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout;

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            clearTimeout(toastTimeout);
            // Force reflow
            void toast.offsetWidth;
            toast.classList.add('show');
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ============================================================
        // LOG
        // ============================================================
        function addLog(message, data) {
            responseLog.style.display = 'block';
            const entry = document.createElement('div');
            entry.style.marginBottom = '4px';
            entry.style.borderBottom = '1px solid #eee';
            entry.style.paddingBottom = '4px';
            const time = new Date().toLocaleTimeString();
            let text = `[${time}] ${message}`;
            if (data) {
                try {
                    text += ' → ' + JSON.stringify(data, null, 2);
                } catch (e) {
                    text += ' → ' + String(data);
                }
            }
            entry.textContent = text;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        // ============================================================
        // API CALL (با لاگ کامل)
        // ============================================================
        async function apiCall(endpoint, options = {}) {
            const url = `${API_BASE}${endpoint}`;
            const headers = {
                'Content-Type': 'application/json',
                ...(options.headers || {})
            };
            const token = localStorage.getItem('jedar_token');
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            addLog(`📤 درخواست: ${options.method || 'GET'} ${endpoint}`, options.body ? JSON.parse(options.body) : null);

            try {
                const res = await fetch(url, {
                    ...options,
                    headers,
                });
                const contentType = res.headers.get('content-type');
                let data;
                if (contentType && contentType.includes('application/json')) {
                    data = await res.json();
                } else {
                    const text = await res.text();
                    data = { success: false, error: text || 'پاسخ غیرمجاز از سرور' };
                }
                addLog(`📥 پاسخ: ${res.status} ${res.statusText}`, data);
                return data;
            } catch (err) {
                const errorMsg = err.message || 'خطا در ارتباط با سرور';
                addLog(`❌ خطا: ${errorMsg}`);
                return { success: false, error: errorMsg };
            }
        }

        // ============================================================
        // TEST CONNECTION
        // ============================================================
        async function testConnection() {
            workerStatus.textContent = 'در حال بررسی...';
            workerStatus.className = 'status unknown';
            testResult.textContent = '';

            try {
                const data = await apiCall('/api/feed');
                if (data.success) {
                    workerStatus.textContent = '✅ آنلاین';
                    workerStatus.className = 'status online';
                    testResult.textContent = `✅ ${data.ads ? data.ads.length : 0} آگهی دریافت شد`;
                    showToast('اتصال به Worker برقرار است ✅', 'success');
                } else {
                    workerStatus.textContent = '⚠️ پاسخ نامعتبر';
                    workerStatus.className = 'status unknown';
                    testResult.textContent = `⚠️ ${data.error || 'پاسخ نامعتبر'}`;
                    showToast('خطا در اتصال به Worker', 'error');
                }
            } catch (err) {
                workerStatus.textContent = '❌ قطع است';
                workerStatus.className = 'status offline';
                testResult.textContent = `❌ ${err.message || 'ارتباط قطع است'}`;
                showToast('ارتباط با Worker قطع است ❌', 'error');
            }
        }

        // ============================================================
        // AUTH
        // ============================================================
        function showLogin() {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            switchText.textContent = 'حساب کاربری ندارید؟';
            switchLink.textContent = 'ثبت‌نام کنید';
            switchLink.onclick = showRegister;
            loginError.style.display = 'none';
            loginSuccess.style.display = 'none';
        }

        function showRegister() {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            switchText.textContent = 'حساب کاربری دارید؟';
            switchLink.textContent = 'ورود';
            switchLink.onclick = showLogin;
            registerError.style.display = 'none';
            registerSuccess.style.display = 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                loginError.textContent = 'لطفاً نام کاربری و رمز عبور را وارد کنید';
                loginError.style.display = 'block';
                loginSuccess.style.display = 'none';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '...';
            loginError.style.display = 'none';
            loginSuccess.style.display = 'none';

            try {
                const data = await apiCall('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                if (data.success && data.token) {
                    localStorage.setItem('jedar_token', data.token);
                    localStorage.setItem('jedar_user', JSON.stringify(data.user));
                    loginSuccess.textContent = '✅ ورود موفق! در حال انتقال...';
                    loginSuccess.style.display = 'block';
                    showToast('خوش آمدید ' + (data.user?.fullname || username), 'success');
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    loginError.textContent = data.error || 'نام کاربری یا رمز عبور اشتباه است';
                    loginError.style.display = 'block';
                }
            } catch (err) {
                loginError.textContent = 'خطا در ارتباط با سرور';
                loginError.style.display = 'block';
            }
            loginBtn.disabled = false;
            loginBtn.textContent = 'ورود';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value.trim();
            const fullname = document.getElementById('registerFullname').value.trim();
            const phone = document.getElementById('registerPhone').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirm').value;

            registerError.style.display = 'none';
            registerSuccess.style.display = 'none';

            if (!username || !fullname || !password || !confirm) {
                registerError.textContent = 'لطفاً تمام فیلدهای اجباری را پر کنید';
                registerError.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                registerError.textContent = 'رمز عبور باید حداقل ۶ کاراکتر باشد';
                registerError.style.display = 'block';
                return;
            }
            if (password !== confirm) {
                registerError.textContent = 'رمز عبور و تکرار آن مطابقت ندارند';
                registerError.style.display = 'block';
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = '...';

            try {
                const data = await apiCall('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, fullname, phone, password })
                });

                if (data.success) {
                    registerSuccess.textContent = '✅ ثبت‌نام موفق! اکنون وارد شوید.';
                    registerSuccess.style.display = 'block';
                    showToast('ثبت‌نام موفق! لطفاً وارد شوید.', 'success');
                    // Reset form
                    document.getElementById('registerUsername').value = '';
                    document.getElementById('registerFullname').value = '';
                    document.getElementById('registerPhone').value = '';
                    document.getElementById('registerPassword').value = '';
                    document.getElementById('registerConfirm').value = '';
                    setTimeout(showLogin, 1500);
                } else {
                    registerError.textContent = data.error || 'خطا در ثبت‌نام';
                    registerError.style.display = 'block';
                }
            } catch (err) {
                registerError.textContent = 'خطا در ارتباط با سرور';
                registerError.style.display = 'block';
            }
            registerBtn.disabled = false;
            registerBtn.textContent = 'ثبت‌نام';
        }

        // ============================================================
        // CHECK LOGIN STATUS
        // ============================================================
        function checkLogin() {
            const token = localStorage.getItem('jedar_token');
            if (token) {
                // Show main app (but we keep it simple - redirect to home or show user)
                const user = JSON.parse(localStorage.getItem('jedar_user') || '{}');
                if (user.username) {
                    // For now, just show a welcome and hide auth
                    document.querySelector('.container .logo').innerHTML =
                        `<i class="fa-solid fa-layer-group"></i> جـدار <span style="font-size:14px; color:var(--primary); display:block; margin-top:4px;">${user.fullname || user.username} عزیز خوش آمدید 👋</span>`;
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'none';
                    document.querySelector('.switch-link').style.display = 'none';
                    // Show logout button
                    const logoutBtn = document.createElement('button');
                    logoutBtn.className = 'btn btn-primary';
                    logoutBtn.style.background = '#ff5e7c';
                    logoutBtn.textContent = 'خروج';
                    logoutBtn.onclick = function() {
                        localStorage.removeItem('jedar_token');
                        localStorage.removeItem('jedar_user');
                        window.location.reload();
                    };
                    document.querySelector('.container').appendChild(logoutBtn);

                    // Show a simple dashboard
                    const dashboard = document.createElement('div');
                    dashboard.style.marginTop = '16px';
                    dashboard.style.padding = '16px';
                    dashboard.style.background = '#f8f8fc';
                    dashboard.style.borderRadius = '12px';
                    dashboard.innerHTML = `
                        <div style="font-weight:600; margin-bottom:8px;">📊 پیشخوان</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                            <div style="background:white; padding:12px; border-radius:10px; text-align:center;">
                                <div style="font-size:12px; color:#888;">موجودی</div>
                                <div style="font-size:20px; font-weight:700; color:var(--primary);">${(user.balance || 0).toLocaleString()} تومان</div>
                            </div>
                            <div style="background:white; padding:12px; border-radius:10px; text-align:center;">
                                <div style="font-size:12px; color:#888;">امتیاز اعتماد</div>
                                <div style="font-size:20px; font-weight:700; color:var(--primary);">${user.trust_score || 50}</div>
                            </div>
                        </div>
                        <div style="margin-top:10px; text-align:center; font-size:13px; color:#888;">
                            <a href="https://mehdieidani.github.io/Alsouq_telegram/app.html" style="color:var(--primary); font-weight:600;">ورود به پنل کامل →</a>
                        </div>
                    `;
                    document.querySelector('.container').appendChild(dashboard);

                    // Hide test info
                    document.getElementById('statusTest').style.display = 'none';
                }
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        apiUrlDisplay.textContent = API_BASE + '/api/feed';

        // Test connection on load
        setTimeout(testConnection, 500);

        // Check login status
        checkLogin();

        // Expose functions for debugging
        window.testConnection = testConnection;
        window.apiCall = apiCall;

        console.log('🚀 جـدار v2.0 - با لاگ کامل');
        console.log(`🔗 API Base: ${API_BASE}`);
    </script>

</body>
</html>
